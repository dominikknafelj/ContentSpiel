<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/photo-spiel-design-system-db45b162-5a11-4130-aabd-9104520c770b/styles.css">
<script src="_ds/photo-spiel-design-system-db45b162-5a11-4130-aabd-9104520c770b/_ds_bundle.js"></script>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: var(--space-4); font-family: var(--font-sans); color: var(--color-text);">
  <sc-if value="{{ isCards }}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: {{ cols }}; gap: var(--space-5) var(--gap-col);">
      <sc-for list="{{ posts }}" as="post" hint-placeholder-count="3">
        <a href="#" style="display: flex; flex-direction: column; gap: var(--space-3); text-decoration: none; color: var(--color-text); min-width: 0;">
          <x-import component-from-global-scope="PhotoSpielDesignSystem_db45b1.Placeholder" seed="{{ post.seed }}" ratio="3/2" hint-size="100%,200px"></x-import>
          <div style="display: flex; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--track-mono); text-transform: uppercase;">
            <span style="color: var(--color-accent);">{{ post.date }}</span>
            <span style="color: var(--color-text-subtle);">· {{ post.category }}</span>
          </div>
          <h3 style="margin: 0; font-weight: 600; font-size: var(--fs-h3); line-height: var(--lh-heading); text-wrap: balance;">{{ post.title }}</h3>
          <p style="margin: 0; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-text-muted); text-wrap: pretty;">{{ post.excerpt }}</p>
        </a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isRows }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; border-top: 1px solid var(--color-line-strong);">
      <sc-for list="{{ posts }}" as="post" hint-placeholder-count="3">
        <a href="#" style="display: grid; grid-template-columns: {{ rowCols }}; gap: var(--space-1) var(--space-4); align-items: baseline; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-line); text-decoration: none; color: var(--color-text);" style-hover="background: var(--color-surface);">
          <span style="font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--color-accent);">{{ post.date }}</span>
          <span style="font-weight: 600; font-size: {{ rowTitle }}; line-height: 1.3; text-wrap: pretty;">{{ post.title }}</span>
          <sc-if value="{{ rowShowCat }}" hint-placeholder-val="{{ true }}">
            <span style="font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--color-text-subtle); text-align: right;">{{ post.category }}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ allLabel }}" hint-placeholder-val="{{ true }}">
    <a href="#" style="align-self: flex-start; font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--color-accent); text-decoration: none; white-space: nowrap;" style-hover="color: var(--color-text);">{{ allLabel }} →</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;half&quot;,&quot;narrow&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;rows&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;allLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;All posts&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;posts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const size = p.size ?? 'full';
    const layout = size === 'narrow' ? 'rows' : (p.layout ?? 'cards');
    const src = p.posts ?? [
      { date: '02 Oct 2026', category: 'Category', title: 'Post title of the most recent entry', excerpt: 'The excerpt, taken from the post’s summary field, two lines at most.' },
      { date: '18 Sep 2026', category: 'Category', title: 'Second post title', excerpt: 'The excerpt, taken from the post’s summary field, two lines at most.' },
      { date: '29 Aug 2026', category: 'Category', title: 'Third post title, a little longer than the others', excerpt: 'The excerpt, taken from the post’s summary field, two lines at most.' },
    ];
    const count = p.count ?? 3;
    return {
      posts: src.slice(0, count).map((x, i) => ({ seed: 3 + i * 2, ...x })),
      isCards: layout === 'cards', isRows: layout === 'rows',
      cols: size === 'full' ? 'repeat(3, minmax(0,1fr))' : 'repeat(2, minmax(0,1fr))',
      rowCols: size === 'narrow' ? 'minmax(0,1fr)' : '120px minmax(0,1fr) auto',
      rowShowCat: size !== 'narrow',
      rowTitle: size === 'narrow' ? 'var(--fs-body)' : 'var(--fs-h3)',
      allLabel: p.allLabel ?? 'All posts',
    };
  }
}
</script>
</body>
</html>
