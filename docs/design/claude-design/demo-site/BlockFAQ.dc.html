<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/photo-spiel-design-system-db45b162-5a11-4130-aabd-9104520c770b/styles.css">
<script src="_ds/photo-spiel-design-system-db45b162-5a11-4130-aabd-9104520c770b/_ds_bundle.js"></script>
</helmet>
<div style="width: 100%; max-width: 860px; font-family: var(--font-sans); color: var(--color-text); border-top: 1px solid var(--color-line-strong);">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
    <div style="border-bottom: 1px solid var(--color-line);">
      <button onClick="{{ it.toggle }}" aria-expanded="{{ it.open }}" style="all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: minmax(0,1fr) 24px; gap: var(--space-3); align-items: baseline; padding: {{ rowPad }} 0;" style-focus="outline: 1px solid var(--color-accent); outline-offset: 2px;">
        <span style="font-weight: 600; font-size: {{ qSize }}; line-height: 1.3; text-wrap: pretty;">{{ it.q }}</span>
        <span style="font-family: var(--font-mono); font-size: 16px; color: var(--color-accent); text-align: right;">{{ it.mark }}</span>
      </button>
      <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 0 32px {{ rowPad }} 0; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-text-muted); max-width: 640px; text-wrap: pretty;">{{ it.a }}</p>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;half&quot;,&quot;narrow&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{q:string,a:string}[]&quot;}}">
class Component extends DCLogic {
  state = { open: { 0: true } };
  renderVals() {
    const p = this.props;
    const size = p.size ?? 'full';
    const src = p.items ?? [
      { q: 'A question as the visitor would ask it?', a: 'A direct answer in one short paragraph. Longer answers belong on their own page.' },
      { q: 'Each question is a button that opens its answer', a: 'Answers open one at a time or several at once; the first can start open.' },
      { q: 'Keyboard and screen readers', a: 'Each question is a real button with aria-expanded, so it works without a mouse.' },
      { q: 'How many questions fit?', a: 'Five to eight read well. Beyond that, split into two blocks with a rich text heading between.' },
    ];
    return {
      items: src.map((it, i) => {
        const open = !!this.state.open[i];
        return { ...it, open, mark: open ? '−' : '+', toggle: () => this.setState(s => ({ open: { ...s.open, [i]: !s.open[i] } })) };
      }),
      qSize: size === 'narrow' ? 'var(--fs-body)' : 'var(--fs-h3)',
      rowPad: size === 'narrow' ? 'var(--space-3)' : 'var(--space-4)',
    };
  }
}
</script>
</body>
</html>
