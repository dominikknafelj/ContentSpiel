<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/photo-spiel-design-system-db45b162-5a11-4130-aabd-9104520c770b/styles.css">
<script src="_ds/photo-spiel-design-system-db45b162-5a11-4130-aabd-9104520c770b/_ds_bundle.js"></script>
</helmet>
<a href="#" style="width: 100%; display: grid; grid-template-columns: {{ cols }}; gap: var(--space-4) var(--space-5); align-items: start; text-decoration: none; color: var(--color-text); font-family: var(--font-sans); border-top: {{ topRule }};" style-hover="color: var(--color-text);">
  <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
    <div style="overflow: hidden;">
      <x-import component-from-global-scope="PhotoSpielDesignSystem_db45b1.Placeholder" seed="{{ seed }}" ratio="{{ ratio }}" style="transition: transform 0.7s var(--ease);" hint-size="100%,220px"></x-import>
    </div>
  </sc-if>
  <div style="display: flex; flex-direction: column; gap: var(--space-2); padding-top: {{ textPadTop }}; min-width: 0;">
    <sc-if value="{{ meta }}" hint-placeholder-val="{{ true }}">
      <div style="font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--color-text-subtle);">{{ meta }}</div>
    </sc-if>
    <h3 style="margin: 0; font-weight: 600; font-size: {{ hSize }}; line-height: var(--lh-heading); letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance;">{{ heading }}</h3>
    <sc-if value="{{ text }}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-text-muted); text-wrap: pretty;">{{ text }}</p>
    </sc-if>
    <span style="margin-top: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--color-accent); white-space: nowrap;">{{ linkLabel }} →</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;half&quot;,&quot;narrow&quot;],&quot;default&quot;:&quot;narrow&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showImage&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Teaser heading&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Read more&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const size = p.size ?? 'narrow';
    const showImage = p.showImage ?? true;
    const full = size === 'full';
    return {
      showImage, seed: p.seed ?? 2,
      meta: p.meta ?? '',
      heading: p.heading ?? 'Teaser heading',
      text: p.text ?? 'A short summary of the page the card links to, two lines at most.',
      linkLabel: p.linkLabel ?? 'Read more',
      cols: full && showImage ? 'minmax(0,1.2fr) minmax(0,1fr)' : 'minmax(0,1fr)',
      ratio: p.ratio ?? (full ? '3/2' : '4/3'),
      hSize: full ? '26px' : 'var(--fs-h3)',
      topRule: showImage ? '0' : '1px solid var(--color-line-strong)',
      textPadTop: showImage ? '0' : 'var(--space-3)',
    };
  }
}
</script>
</body>
</html>
