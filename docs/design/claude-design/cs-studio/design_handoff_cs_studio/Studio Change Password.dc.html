<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="content-spiel.css">
<script>try{var t=localStorage.getItem('cs-theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<style>body{margin:0;background:var(--cs-paper);color:var(--cs-ink);font-family:var(--cs-font);-webkit-font-smoothing:antialiased}a{color:var(--cs-accent);text-decoration:none}a:hover{color:var(--cs-accent-hover)}input,textarea,button,select{font-family:inherit}</style>
</helmet>
<div style="display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:var(--cs-paper);color:var(--cs-ink)">
<dc-import name="StudioSidebar" active="" hint-size="232px,100vh"></dc-import>
<main style="padding:28px 32px 64px;display:flex;flex-direction:column;gap:18px;max-width:560px;width:100%;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:26px;font-weight:600">Change password</h1><p style="margin:0;font-size:14px;color:var(--cs-dim)">You’ll stay signed in here. Other sessions are signed out.</p></div>
  <section style="background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:2px">
    <div style="padding:18px;display:flex;flex-direction:column;gap:16px">
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--cs-mono);font-size:10px;letter-spacing:0.14em;color:var(--cs-meta)">CURRENT PASSWORD</span>
        <span style="display:flex;align-items:center;border:1px solid {{ curBorder }};border-radius:2px;background:var(--cs-surface)"><input type="password" value="hunter2hunter2" style="flex:1;min-width:0;font-size:14px;color:var(--cs-ink);background:transparent;border:0;padding:9px 11px;outline:none"></input></span>
        <sc-if value="{{ wrong }}" hint-placeholder-val="{{ false }}"><span style="display:flex;gap:6px;font-size:12px;color:var(--cs-danger-ink)"><b style="font-weight:600">!</b>That’s not your current password.</span></sc-if></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--cs-mono);font-size:10px;letter-spacing:0.14em;color:var(--cs-meta)">NEW PASSWORD</span>
        <span style="display:flex;align-items:center;border:1px solid var(--cs-accent);box-shadow:0 0 0 3px var(--cs-accent-tint);border-radius:2px;background:var(--cs-surface)"><input type="{{ pwType }}" value="{{ pw }}" onInput="{{ onPw }}" style="flex:1;min-width:0;font-size:14px;color:var(--cs-ink);background:transparent;border:0;padding:9px 11px;outline:none"></input><button onClick="{{ togglePw }}" style="font-size:12px;font-weight:500;color:var(--cs-accent);background:none;border:0;padding:0 11px;cursor:pointer">{{ pwLabel }}</button></span>
        <span style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><span style="height:3px;background:{{ b.c }}"></span></sc-for></span>
        <span style="font-size:12px;color:var(--cs-dim)">{{ strength }}</span></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--cs-mono);font-size:10px;letter-spacing:0.14em;color:var(--cs-meta)">CONFIRM NEW PASSWORD</span>
        <input type="password" value="{{ pw }}" style="font-size:14px;color:var(--cs-ink);background:var(--cs-surface);border:1px solid var(--cs-line-strong);border-radius:2px;padding:9px 11px;outline:none"></input></label>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--cs-line)">
      <a href="Studio%20Password%20Reset.dc.html" style="font-size:13px">Forgot your current password?</a>
      <button disabled="{{ tooShort }}" style="font-weight:500;font-size:13px;background:var(--cs-accent);color:var(--cs-on-accent);border:1px solid var(--cs-accent);border-radius:2px;padding:7px 14px;opacity:{{ btnOpacity }}">Change password</button>
    </div>
  </section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;wrong&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { pw: 'tram ferry', show: false };
  renderVals() {
    const pw = this.state.pw;
    const words = pw.trim().split(/\s+/).filter(Boolean).length;
    const score = pw.length < 12 ? 1 : pw.length < 16 ? 2 : (words >= 3 || pw.length >= 20) ? 4 : 3;
    const col = score === 1 ? 'var(--cs-danger)' : score === 2 ? 'var(--cs-warn)' : 'var(--cs-ok)';
    return {
      pw, onPw: e => this.setState({ pw: e.target.value }),
      pwType: this.state.show ? 'text' : 'password', pwLabel: this.state.show ? 'Hide' : 'Show', togglePw: () => this.setState(s => ({ show: !s.show })),
      bars: [1, 2, 3, 4].map(i => ({ c: i <= score ? col : 'var(--cs-line)' })),
      strength: ['', 'Too short. Use 12 or more characters.', 'Fair. A few unrelated words work well.', 'Good.', 'Strong.'][score],
      tooShort: score === 1, btnOpacity: score === 1 ? 0.5 : 1,
      wrong: !!this.props.wrong, curBorder: this.props.wrong ? 'var(--cs-danger)' : 'var(--cs-line-strong)'
    };
  }
}
</script>
</body>
</html>
