<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="content-spiel.css">
<script>try{var t=localStorage.getItem('cs-theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<style>body{margin:0;background:var(--cs-paper);color:var(--cs-ink);font-family:var(--cs-font);-webkit-font-smoothing:antialiased}a{color:var(--cs-accent);text-decoration:none}a:hover{color:var(--cs-accent-hover)}input,textarea,button,select{font-family:inherit}</style>
</helmet>
<div style="display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:var(--cs-paper);color:var(--cs-ink)">
<dc-import name="StudioSidebar" active="tags" hint-size="232px,100vh"></dc-import>
<main style="padding:28px 32px 64px;display:flex;flex-direction:column;gap:16px;max-width:820px;width:100%;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:26px;font-weight:600">Tags</h1><p style="margin:0;font-size:14px;color:var(--cs-dim)">Tags are created when you add them to a post. Click a name to rename it.</p></div>
  <div style="background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:2px">
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:12px;padding:9px 16px;border-bottom:1px solid var(--cs-line-strong);font-family:var(--cs-mono);font-size:10px;letter-spacing:0.12em;color:var(--cs-meta)"><span>NAME</span><span>POSTS</span><span></span></div>
    <sc-for list="{{ tags }}" as="t" hint-placeholder-count="4">
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--cs-line)">
        <span contenteditable="true" style="font-size:14px;padding:4px 6px;margin-left:-6px;border:1px solid transparent;border-radius:2px;outline:none" style-hover="border-color:var(--cs-line-strong)">{{ t.name }}</span>
        <a href="Studio%20Posts.dc.html" style="font-family:var(--cs-mono);font-size:12px">{{ t.n }}</a>
        <button title="Merge into…, Delete" style="font-size:14px;background:transparent;border:0;color:var(--cs-meta);cursor:pointer">⋯</button>
      </div>
    </sc-for>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { tags: [['gear', '1 post'], ['news', '2 posts'], ['studio', '1 post'], ['workshops', '1 post']].map(([name, n]) => ({ name, n })) };
  }
}
</script>
</body>
</html>
