<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="content-spiel.css">
<script>try{var t=localStorage.getItem('cs-theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<style>body{margin:0;background:var(--cs-paper);color:var(--cs-ink);font-family:var(--cs-font);-webkit-font-smoothing:antialiased}a{color:var(--cs-accent);text-decoration:none}a:hover{color:var(--cs-accent-hover)}input,textarea,button,select{font-family:inherit}</style>
</helmet>
<div style="display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:var(--cs-paper);color:var(--cs-ink)">
<dc-import name="StudioSidebar" active="audit" hint-size="232px,100vh"></dc-import>
<main style="padding:28px 32px 64px;display:flex;flex-direction:column;gap:18px;max-width:1000px;width:100%;box-sizing:border-box">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:12px;color:var(--cs-meta)"><a href="Studio%20Audit%20Log.dc.html" style="color:var(--cs-meta)">Audit log</a> /</span>
    <h1 style="margin:0;font-size:22px;font-weight:600;line-height:1.3">You edited the English of <a href="Studio%20Post%20Editor.dc.html">Welcome to our new site</a></h1>
  </div>
  <section style="background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:2px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    <sc-for list="{{ meta }}" as="m" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-right:1px solid var(--cs-line);border-bottom:1px solid var(--cs-line)">
        <span style="font-family:var(--cs-mono);font-size:10px;letter-spacing:0.14em;color:var(--cs-meta)">{{ m.k }}</span>
        <span style="font-size:13px;font-family:{{ m.font }}">{{ m.v }}</span>
      </div>
    </sc-for>
  </section>
  <section style="background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:2px;overflow-x:auto">
    <div style="padding:13px 16px;border-bottom:1px solid var(--cs-line);display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">Changes</span><span style="font-family:var(--cs-mono);font-size:11px;color:var(--cs-meta)">2 FIELDS · ENGLISH</span></div>
    <div style="display:grid;grid-template-columns:140px minmax(200px,1fr) minmax(200px,1fr);gap:16px;min-width:640px;padding:9px 16px;border-bottom:1px solid var(--cs-line-strong);font-family:var(--cs-mono);font-size:10px;letter-spacing:0.12em;color:var(--cs-meta)"><span>FIELD</span><span>BEFORE</span><span>AFTER</span></div>
    <div style="display:grid;grid-template-columns:140px minmax(200px,1fr) minmax(200px,1fr);gap:16px;min-width:640px;padding:12px 16px;border-bottom:1px solid var(--cs-line);font-size:14px;line-height:1.55;align-items:start">
      <span style="font-family:var(--cs-mono);font-size:12px;color:var(--cs-dim)">title</span>
      <span>Welcome to <span style="text-decoration:line-through;color:var(--cs-danger-ink);background:var(--cs-danger-tint);padding:0 2px">the</span> new site</span>
      <span>Welcome to <span style="color:var(--cs-ok-ink);background:var(--cs-ok-tint);padding:0 2px">our</span> new site</span>
    </div>
    <div style="display:grid;grid-template-columns:140px minmax(200px,1fr) minmax(200px,1fr);gap:16px;min-width:640px;padding:12px 16px;border-bottom:1px solid var(--cs-line);font-size:14px;line-height:1.55;align-items:start">
      <span style="font-family:var(--cs-mono);font-size:12px;color:var(--cs-dim)">excerpt</span>
      <span style="color:var(--cs-meta)">Empty</span>
      <span><span style="color:var(--cs-ok-ink);background:var(--cs-ok-tint);padding:0 2px">We rebuilt everything from scratch.</span></span>
    </div>
  </section>
  <details style="background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:2px">
    <summary style="padding:12px 16px;cursor:pointer;font-family:var(--cs-mono);font-size:10px;letter-spacing:0.14em;color:var(--cs-meta)">RAW EVENT</summary>
    <pre style="margin:0;padding:12px 16px;border-top:1px solid var(--cs-line);background:var(--cs-paper);font-family:var(--cs-mono);font-size:12px;line-height:1.6;overflow-x:auto">{{ raw }}</pre>
  </details>
  <div style="display:flex;justify-content:space-between;font-size:13px"><a href="#">‹ Older event</a><a href="#">Newer event ›</a></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const mono = 'var(--cs-mono)', sans = 'var(--cs-font)';
    return {
      meta: [
        { k: 'WHEN', v: 'Fri 2 Oct 2026, 16:05–16:31 · 12 saves', font: sans }, { k: 'WHO', v: 'Mara König', font: sans },
        { k: 'CHANNEL', v: 'ADMIN', font: mono }, { k: 'ACTION', v: 'post.updated', font: mono },
        { k: 'OBJECT', v: 'Post #5 · Blog post', font: sans }, { k: 'REQUEST', v: '7c1e…a90f', font: mono }
      ],
      raw: '{\n  "action": "post.updated",\n  "actor": { "type": "User", "id": 1 },\n  "subject": { "type": "Post", "id": 5 },\n  "locale": "en",\n  "changes": {\n    "title": ["Welcome to the new site", "Welcome to our new site"],\n    "excerpt": [null, "We rebuilt everything from scratch."]\n  }\n}'
    };
  }
}
</script>
</body>
</html>
