# A completed setup, so the rest of the suite isn't redirected into /setup
# (Setup::RedirectConstraint). Tests that need a fresh install clear
# setup_completed_at themselves (see test/test_helpers/setup_test_helper.rb).
default:
  # Translated (Mobility jsonb, translation helpers spec §5).
  title: { en: Test Site }
  default_locale: en
  # The suite's site has three languages on, so every test meets a default
  # language and two others; a new site starts with English alone (the
  # column's default, test/models/site_setting_test.rb).
  locales: [ { code: en }, { code: de }, { code: es } ]
  setup_completed_at: <%= Time.current.to_fs(:db) %>
  # A sender address and nothing else of mail: with the test environment's
  # stand-in (`:test`, plan Ruling 1) the settings are complete and untested,
  # so a mail a test builds has a From and is delivered into
  # `ActionMailer::Base.deliveries`. A test that needs another state says so
  # with `with_mail_state` (test/support/mail_state.rb).
  mail_sender_address: no-reply@example.test
