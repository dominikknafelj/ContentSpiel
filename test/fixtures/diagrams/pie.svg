<svg id="diagram-7" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606.921875 450" style="max-width: 606.921875px;" role="graphics-document document" aria-roledescription="pie" aria-describedby="chart-desc-diagram-7"><desc id="chart-desc-diagram-7">Most visitors read the site in English.</desc><style>#diagram-7{font-family:Archivo;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram-7 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram-7 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram-7 .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#diagram-7 .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#diagram-7 .edge-thickness-normal{stroke-width:1px;}#diagram-7 .edge-thickness-thick{stroke-width:3.5px;}#diagram-7 .edge-pattern-solid{stroke-dasharray:0;}#diagram-7 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram-7 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-7 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-7 .marker{fill:#0b0b0b;stroke:#0b0b0b;}#diagram-7 .marker.cross{stroke:#0b0b0b;}#diagram-7 svg{font-family:Archivo;font-size:16px;}#diagram-7 p{margin:0;}#diagram-7 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#diagram-7 .pieCircle.highlighted{scale:1.05;opacity:1;}#diagram-7 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#diagram-7 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#diagram-7 .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:Archivo;}#diagram-7 .slice{font-family:Archivo;fill:#333;font-size:17px;}#diagram-7 .legend text{fill:#333;font-family:Archivo;font-size:17px;}#diagram-7 .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#diagram-7 [data-look="neo"].node rect,#diagram-7 [data-look="neo"].cluster rect,#diagram-7 [data-look="neo"].node polygon{stroke:url(#diagram-7-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-7 [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram-7 [data-look="neo"].node path{stroke:url(#diagram-7-gradient);stroke-width:1px;}#diagram-7 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-7 [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#diagram-7 [data-look="neo"].node circle{stroke:url(#diagram-7-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-7 [data-look="neo"].node circle .state-start{fill:#000000;}#diagram-7 [data-look="neo"].icon-shape .icon{fill:url(#diagram-7-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-7 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#diagram-7-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram-7 :root{--mermaid-font-family:Archivo;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-126.641,134.859L0,0Z" fill="#fff4dd" class="pieCircle"></path><path d="M-126.641,134.859A185,185,0,0,1,-134.859,-126.641L0,0Z" fill="hsl(-79.4117647059, 100%, 93.3333333333%)" class="pieCircle"></path><path d="M-134.859,-126.641A185,185,0,0,1,0,-185L0,0Z" fill="hsl(220.5882352941, 100%, 98.3333333333%)" class="pieCircle"></path><text transform="translate(129.00648741699487,51.07728168499908)" class="slice" style="text-anchor: middle;">62%</text><text transform="translate(-138.68153525074527,4.3582428220902925)" class="slice" style="text-anchor: middle;">25%</text><text transform="translate(-55.10426982557576,-127.33845431365239)" class="slice" style="text-anchor: middle;">13%</text></g><text x="0" y="-200" class="pieTitleText">Visitors by language</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(255, 244, 221); stroke: rgb(255, 244, 221);"></rect><text x="22" y="14">English [62]</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(244, 221, 255); stroke: rgb(244, 221, 255);"></rect><text x="22" y="14">German [25]</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(247, 249, 255); stroke: rgb(247, 249, 255);"></rect><text x="22" y="14">Spanish [13]</text></g></g></svg>