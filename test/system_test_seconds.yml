# Seconds each system test file took on a CI runner (measured on 2026-11-06 from
# the run of actions 42163862424: the sum of each file's per-test times, as the
# four shards' logs print them with `-v`, 1336 tests). `bin/test-shard system`
# deals CI's four shards by these numbers so the jobs finish at about the same
# time. A shard runs four worker processes, so its test time is about a quarter
# of its sum. This table needs no upkeep: a file it does not list is weighed by
# its number of tests, an entry for a file that is gone is ignored, and a stale
# number only makes the shards a little uneven. To measure again: the per-test
# lines end in " s = ", and a test's class name finds its file. Three files are
# from a later run, 42318225796, #190's (2026-11-06; 00:26 on 2026-11-07 in
# UTC): tree_fold_test, editor_modules_test and entry_helpers_test;
# editor_modules_test held 9 of its 15 tests then.
