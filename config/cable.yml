# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  # A broadcast reaches a subscriber within one interval. Notes, presence and
  # editing signals are read by a person, so a quarter second is not seen;
  # the listener's poll is a statement on the cable database every interval
  # of every process, idle or not, so a shorter one is load on a small host
  # for nobody.
  polling_interval: 0.25.seconds
  message_retention: 1.day
