# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  trash_purge_expired:
    class: Trash::PurgeExpiredJob
    queue: default
    schedule: every day at 3am
  forms_purge_expired:
    class: Forms::PurgeExpiredJob
    queue: default
    schedule: every day at 3:30am
  forms_resend_not_ready:
    class: Forms::ResendNotReadyJob
    queue: default
    schedule: every 15 minutes
  public_paths_sync_went_live:
    class: PublicSite::SyncWentLiveJob
    queue: default
    schedule: every 5 minutes
  presence_sweep:
    class: Presence::Sweep
    queue: default
    schedule: every 5 minutes
  editing_sweep:
    class: Editing::Sweep
    queue: default
    schedule: every 5 minutes
  media_backfill:
    class: Media::BackfillJob
    queue: images
    schedule: every 10 minutes
  sessions_sweep:
    class: Sessions::SweepJob
    queue: default
    schedule: every hour at minute 40
  sso_recheck:
    class: Sso::RecheckJob
    queue: default
    schedule: every hour at minute 25

