# Name of your application. Used to uniquely configure containers.
service: content_spiel

# Name of the container image (use your-user/app-name on external registries).
image: content_spiel

# Deploy to these servers.
servers:
  web:
    - 192.168.0.1
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this needs PUBLIC_HOST set to the site's https address: uncomment the line under
# env.clear, below, and write the address. HTTPS is then forced from it (lib/host_settings.rb), and
# production.rb sets neither config.force_ssl nor config.assume_ssl itself. Until it is set the site answers
# any host name and forces nothing. ASSUME_SSL=1 is only for a proxy that does not send X-Forwarded-Proto.
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
proxy:
  # ssl: true
  # host: app.example.com

  # Behind Cloudflare: hand on Cloudflare's X-Forwarded-For (with ssl: true kamal-proxy otherwise writes its
  # own, naming only the edge), and set TRUSTED_PROXIES to Cloudflare's ranges too (docs/reference/hosting.md).
  # forward_headers: true

  # How long kamal-proxy waits for the app to answer a request (default 30 s).
  # CS Studio's AI translation suggestions (`POST /<admin>/translations/suggest`)
  # wait on the AI provider inside the web request: up to two provider calls of
  # at most 25 s each (`AI::Providers::Anthropic::TIMEOUT`). 75 s outlasts both,
  # so the proxy never cuts off a request Puma is still serving.
  # test/models/ai/providers/anthropic_test.rb checks the two stay in step.
  response_timeout: 75

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # The site's address with its scheme. Required on a public address: only this host name is then
    # answered, HTTPS is forced, and pages and the password reset mail carry it (docs/reference/hosting.md).
    # PUBLIC_HOST: https://www.example.org
    # Only for a backend behind a DMZ: CS Studio's own address, served on that host alone
    # (docs/reference/hosting.md, "Behind a DMZ").
    # ADMIN_HOST: https://studio.example.internal

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Where the four databases are (libpq reads it; config/database.yml names no host).
    # Use content_spiel-db for a db accessory server on same machine via local kamal docker network.
    # PGHOST: 192.168.0.2

    # The log level: info (the default) or above on a site other people use. At debug Rails logs
    # every mail whole, a password reset link with its token included.
    # RAILS_LOG_LEVEL: info

    # Every variable the application reads: docs/reference/hosting.md, "Every variable the code reads".

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "content_spiel_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.9
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
