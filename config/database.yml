# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
# Connection details (host/port/username/password) deliberately live in the
# per-environment sections rather than here: `production:` merges this block,
# so anything added here would silently follow the app into production.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


# Points at the Postgres container from docker-compose.yml (host port 5433).
development:
  <<: *default
  database: content_spiel_development
  host: localhost
  port: 5433
  username: contentspiel
  password: contentspiel
  # libpq on macOS negotiates GSSAPI encryption first, through Kerberos,
  # which is not safe after a fork: a parallel test run's worker can crash in
  # the pg gem and hang the run. The compose Postgres offers no GSSAPI, so the
  # negotiation is off for development and test (test/lib/database_gssencmode_test.rb).
  gssencmode: disable

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: content_spiel

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# Each working folder has a test database of its own, named after the folder
# (lib/content_spiel/test_database.rb says why); all live in the one Postgres
# container, and a parallel run adds its worker's number to the name.
test:
  <<: *default
  database: <%= require_relative "../lib/content_spiel/test_database"; ContentSpiel::TestDatabase.name_for(Rails.root) %>
  host: localhost
  port: 5433
  username: contentspiel
  password: contentspiel
  # As development's, above.
  gssencmode: disable

# Production's four databases name no host: libpq's PGHOST says where they
# are, and CONTENT_SPIEL_DATABASE_PASSWORD is the role's password. A
# DATABASE_URL is merged over the primary entry alone (CACHE_DATABASE_URL and
# the others over theirs). Every variable, with who sets it:
# docs/reference/hosting.md, "Every variable the code reads".
production:
  primary: &primary_production
    <<: *default
    database: content_spiel_production
    username: content_spiel
    password: <%= ENV["CONTENT_SPIEL_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: content_spiel_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: content_spiel_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: content_spiel_production_cable
    migrations_paths: db/cable_migrate
