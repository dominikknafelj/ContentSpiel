default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Never "*": the images queue has a worker of its own with ONE thread, so
    # a burst of uploads queues behind itself and not in front of mail.
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: "images"
      threads: 1
      processes: 1
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
