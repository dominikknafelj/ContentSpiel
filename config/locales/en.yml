# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # CS Studio's named formats, for `I18n.l(value, format: :"admin.short")`
  # (docs/reference/i18n.md, "A date or a time"). Month names come from Rails'
  # own `date.abbr_month_names`. The admin shows times in the site time zone
  # (`Time.use_zone`); a format only lays the value out.
  date:
    formats:
      admin:
        short: "%-d %b"
        short_with_year: "%-d %b %Y"
  time:
    formats:
      admin:
        short: "%-d %b"
        short_with_year: "%-d %b %Y"
        time: "%H:%M"
        short_datetime: "%-d %b, %H:%M"
        datetime: "%-d %b %Y, %H:%M"

  # A `:code` field over its limit (`ContentModel::FieldSet#code_limit`):
  # Rails' own "is too long" sentence with the limit grouped for reading
  # ("20,000"), as the counter under the field says it. `%{limit}` arrives
  # formatted.
  errors:
    messages:
      code_too_long: "is too long (maximum is %{limit} characters)"
      # A Table block's body over its hard limits (`TableBody`): the editors'
      # own sentences, shown with no language prefix. The figures arrive
      # formatted ("2,000").
      table_too_large: "A table can have at most %{columns} columns and %{rows} rows."
      table_cell_too_long: "A cell can have at most %{characters} characters."

  # How these columns are named in validation messages ("AI provider isn't
  # an available provider", not Rails' default "Ai provider ...").
  activerecord:
    attributes:
      site_setting:
        ai_provider: "AI provider"
        ai_model: "AI model"
        ai_api_key: "AI API key"
        # Settings → Mail's fields, named as the card names them.
        mail_server: "Server"
        mail_port: "Port"
        mail_security: "Security"
        mail_sender_name: "Sender name"
        mail_sender_address: "Sender address"
        mail_username: "Username"
        mail_password: "Password"
    errors:
      models:
        # Settings → Mail: each refusal is a whole sentence, the same under
        # its field and in the summary (`SiteSetting`'s mail validations).
        site_setting:
          attributes:
            mail_sender_name:
              format: "%{message}"
              line_break: "Sender name can't contain a line break."
            mail_sender_address:
              format: "%{message}"
              one_address: "Sender address must be one address, like no-reply@example.com."
            mail_port:
              format: "%{message}"
              port_range: "Port must be a number from 1 to 65535."
            mail_security:
              format: "%{message}"
              security_choice: "Security must be STARTTLS or TLS."
        user:
          attributes:
            # The password length rule's message is a whole sentence
            # ("Use at least 12 characters.", User::MINIMUM_PASSWORD_LENGTH)
            # that must read the same wherever it is shown, so errors on
            # `password` carry no "Password " prefix in `full_messages`. The
            # two other messages that can land on it are spelled out with
            # the prefix they would otherwise have had.
            password:
              format: "%{message}"
              blank: "Password can't be blank"
              too_long: "Password is too long (maximum is %{count} characters)"
            # "Change password": a wrong current password reads the same
            # under its field and in the summary, with no attribute prefix.
            current_password:
              format: "%{message}"
