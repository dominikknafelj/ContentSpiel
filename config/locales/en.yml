# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # How these columns are named in validation messages ("AI provider isn't
  # an available provider", not Rails' default "Ai provider ...").
  activerecord:
    attributes:
      site_setting:
        ai_provider: "AI provider"
        ai_model: "AI model"
        ai_api_key: "AI API key"
    errors:
      models:
        user:
          attributes:
            # The password length rule's message is a whole sentence
            # ("Use at least 12 characters.", User::MINIMUM_PASSWORD_LENGTH)
            # that must read the same wherever it is shown, so errors on
            # `password` carry no "Password " prefix in `full_messages`. The
            # two other messages that can land on it are spelled out with
            # the prefix they would otherwise have had.
            password:
              format: "%{message}"
              blank: "Password can't be blank"
              too_long: "Password is too long (maximum is %{count} characters)"
