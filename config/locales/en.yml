# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # CS Studio's named formats, for `I18n.l(value, format: :"admin.short")`
  # (docs/reference/i18n.md, "A date or a time"). Month names come from Rails'
  # own `date.abbr_month_names`. The admin shows times in the site time zone
  # (`Time.use_zone`); a format only lays the value out.
  date:
    formats:
      admin:
        short: "%-d %b"
        short_with_year: "%-d %b %Y"
        # A day with its weekday ("Mon 5 Oct"): the audit log's day bands.
        day: "%a %-d %b"
        day_with_year: "%a %-d %b %Y"
  time:
    formats:
      admin:
        short: "%-d %b"
        short_with_year: "%-d %b %Y"
        time: "%H:%M"
        short_datetime: "%-d %b, %H:%M"
        datetime: "%-d %b %Y, %H:%M"

  # The words `Array#to_sentence` joins a list with ("A, B, and C"). Active
  # Support ships English's and no other language's and falls back to them,
  # so every admin language writes its own: `test/lib/admin_i18n_test.rb`
  # refuses an admin language without them (docs/reference/i18n.md, "A list
  # joined into a sentence"). English's are Active Support's values.
  support:
    array:
      words_connector: ", "
      two_words_connector: " and "
      last_word_connector: ", and "

  # A `:code` field over its limit (the `:code` type's `validate`, `ContentModel::FieldTypes`):
  # Rails' own "is too long" sentence with the limit grouped for reading
  # ("20,000"), as the counter under the field says it. `%{limit}` arrives
  # formatted.
  errors:
    messages:
      code_too_long: "is too long (maximum is %{limit} characters)"
      # A Table block's body over its hard limits (`TableBody`): the editors'
      # own sentences, shown with no language prefix. The figures arrive
      # formatted ("2,000").
      table_too_large: "A table can have at most %{columns} columns and %{rows} rows."
      table_cell_too_long: "A cell can have at most %{characters} characters."
      # A Diagram block's line rules, one sentence per `Diagrams::Source`
      # rule, which the editor's card shows (`Admin::Fields::MermaidField::
      # SENTENCES` hands them to the script); no save is refused for them
      # (`:mermaid` refuses only the length). `invalid_drawing` is
      # `:diagram_drawing`'s refusal. `%{word}` is what the line
      # holds; the directive's word is its marker, `%%{`, because a `%%`
      # written here would be read as an escaped `%`. `%{types}` arrives
      # joined ("flowchart, sequenceDiagram, …").
      diagram_colours: "Line %{line}: colours come from the site's theme, so %{word} isn't used here."
      diagram_links: "Line %{line}: a diagram can't hold links or actions, so %{word} isn't used here."
      diagram_directive: "Line %{line}: settings in %{word} } aren't used here, so the drawing follows the site."
      diagram_front_matter: "Line %{line}: settings in --- front matter aren't used here, so the drawing follows the site."
      diagram_maths: "Line %{line}: maths can't be drawn here, so $$ isn't used."
      diagram_unsupported: "%{type} diagrams aren't supported yet. Use one of: %{types}."
      diagram_no_type: "The first line names the diagram's type, like flowchart or sequenceDiagram."
      invalid_drawing: "This drawing can't be shown on the site."

  # A Section's anchor (`BlockTypes::Section`): whole sentences, shown under the
  # field with no prefix (`activerecord.errors.models.content_block` below).
  block_types:
    section:
      anchor_format: "An anchor can hold lowercase letters, digits and hyphens, must start with a letter and can have at most 40 characters."
      anchor_taken: "Another section on this page is already called `%{anchor}`."
      anchor_reserved: "`%{anchor}` is already taken by the page itself. Choose another anchor."

  # How these columns are named in validation messages ("AI provider isn't
  # an available provider", not Rails' default "Ai provider ...").
  activerecord:
    attributes:
      site_setting:
        ai_provider: "AI provider"
        ai_model: "AI model"
        ai_api_key: "AI API key"
        # Settings → Mail's fields, named as the card names them.
        mail_server: "Server"
        mail_port: "Port"
        mail_security: "Security"
        mail_sender_name: "Sender name"
        mail_sender_address: "Sender address"
        mail_username: "Username"
        mail_password: "Password"
        image_format: "Image format"
        image_quality_webp: "WebP quality"
        image_quality_avif: "AVIF quality"
        image_widths: "Image widths"
        image_max_upload_mb: "Largest upload"
    errors:
      models:
        # Settings → Mail: each refusal is a whole sentence, the same under
        # its field and in the summary (`SiteSetting`'s mail validations).
        site_setting:
          attributes:
            mail_sender_name:
              format: "%{message}"
              line_break: "Sender name can't contain a line break."
            mail_sender_address:
              format: "%{message}"
              one_address: "Sender address must be one address, like no-reply@example.com."
            mail_port:
              format: "%{message}"
              port_range: "Port must be a number from 1 to 65535."
            mail_security:
              format: "%{message}"
              security_choice: "Security must be STARTTLS or TLS."
            image_widths:
              format: "%{message}"
              image_widths: "Use 1 to 6 different widths, each from 160 to 4000 pixels."
            image_format:
              format: "%{message}"
              inclusion: "Image format must be WebP or AVIF."
            image_quality_webp:
              format: "%{message}"
              quality_range: "WebP quality must be a whole number from 1 to 100."
            image_quality_avif:
              format: "%{message}"
              quality_range: "AVIF quality must be a whole number from 1 to 100."
            image_max_upload_mb:
              format: "%{message}"
              upload_range: "Largest upload must be a whole number of MB, from 1 to 50."
            form_keep_days:
              format: "%{message}"
              keep_days_range: "Days to keep submissions must be a whole number of days, from 1 to 3650."
        # A Section's anchor is named by its sentence: the attribute is the dotted
        # `settings.anchor` (`ContentBlock#settings_are_valid`).
        content_block/settings:
          attributes:
            anchor:
              format: "%{message}"
        # An image upload's refusals (`Media::Asset`), read as Active Record
        # joins them with the attribute: "File can't be read as an image".
        media/asset:
          attributes:
            file:
              too_large: "must be %{size} or smaller"
              unreadable: "can't be read as an image"
              too_many_pixels: "is too large to process (over 100 megapixels)"
              too_many_frames: "is too long an animation to process (over 500 megapixels across its frames)"
        # The Add and Rename dialogs' refusal of a blank name, a whole
        # sentence under the field, with no "Name " prefix; the two other
        # messages that can land on it are spelled out with theirs.
        passkey:
          attributes:
            name:
              format: "%{message}"
              blank: "Give the passkey a name."
              too_long: "Name is too long (maximum is %{count} characters)"
        user:
          attributes:
            # The password length rule's message is a whole sentence
            # ("Use at least 12 characters.", User::MINIMUM_PASSWORD_LENGTH)
            # that must read the same wherever it is shown, so errors on
            # `password` carry no "Password " prefix in `full_messages`. The
            # two other messages that can land on it are spelled out with
            # the prefix they would otherwise have had. `leaked` is
            # `SignIn::Password::LeakedRule`'s, a whole sentence too.
            password:
              format: "%{message}"
              blank: "Password can't be blank"
              too_long: "Password is too long (maximum is %{count} characters)"
              leaked: "This password is in a list of leaked passwords, so it isn't safe to use. Choose another one."
            # "Change password": a wrong current password reads the same
            # under its field and in the summary, with no attribute prefix.
            current_password:
              format: "%{message}"
