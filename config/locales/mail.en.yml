en:
  mail:
    # A failed send's sentence, by its key (`MailFailure::KEYS`; spec, "A
    # failure's sentence"). Shown in CS Studio: System status shows the
    # sentence alone, the Mail card the sentence and the server's line.
    failure:
      login: "The server refused the login. Check username and password."
      connect: "Could not reach %{server} on port %{port}. Check server and port."
      security: "The server expects a different security setting. Try STARTTLS with port 587, or TLS with port 465."
      sender: "The server refused the sender address."
      other: "The mail could not be sent."
    # The mails (spec, "The mails"; design answer M6). Every line of a mail
    # is a key here, read in `I18n.default_locale` for now; interpolations
    # are %{site}, %{inviter}, %{minutes}, %{date}, %{count}, %{time} and
    # %{address}.
    footer: "Sent by %{site} via Content Spiel"
    reset:
      subject: "Reset your password for %{site}"
      intro: "Someone asked to reset the password for your account on %{site}. Use this link within %{minutes} minutes:"
      button: "Reset password"
      outro: "If this wasn't you, ignore this mail. Your password stays the same."
    # The mail to an account whose sign-in a run of failed attempts paused
    # (`SignInMailer#locked`): %{count} is the pause's minutes, %{time} when
    # the attempt that paused it came, in the site's zone, %{address} the
    # address it came from.
    locked:
      subject: "Signing in to %{site} is paused"
      intro:
        one: "There were several failed attempts to sign in to your account on %{site}, so signing in is paused for %{count} minute."
        other: "There were several failed attempts to sign in to your account on %{site}, so signing in is paused for %{count} minutes."
      details: "The last attempt was at %{time}, from the address %{address}."
      button: "Reset password"
      outro: "If this was you, wait and try again, or reset your password, which ends the pause. A browser you have signed in with before is not paused. If it wasn't you, your password kept them out, and resetting it is still the safest step."
    # The mails to an account whose second factors changed
    # (`SignInMailer#passkey_added`, `#recovery_code_used`): %{name} is the
    # passkey's name, %{time} in the site's zone, %{address} where the code
    # was used from, %{count} the codes left. No code or key is in either.
    passkey_added:
      subject: "A passkey was added to your account on %{site}"
      intro: "A passkey named “%{name}” was added to your account on %{site} at %{time}."
      button: "Open Your account"
      outro: "If this wasn't you, remove the passkey there and change your password."
    recovery_code_used:
      subject: "A recovery code was used on %{site}"
      intro:
        one: "A recovery code was used to sign in to your account on %{site} at %{time}, from the address %{address}. 1 code is left."
        other: "A recovery code was used to sign in to your account on %{site} at %{time}, from the address %{address}. %{count} codes are left."
      button: "Open Your account"
      outro: "If this wasn't you, regenerate your recovery codes and change your password."
    invite:
      subject: "%{inviter} invited you to %{site}"
      intro: "%{inviter} invited you to work on %{site} in Content Spiel. Set a password to finish your account:"
      button: "Set password"
      outro: "This link works until %{date}. If you weren't expecting this, ignore this mail."
    test:
      subject: "Test mail from %{site}"
      body: "Mail from Content Spiel works."
    # A form's submission, mailed to its recipients:
    # %{form} is the form's name, which editors give it and visitors never
    # see. The answers are listed between the intro and the three lines.
    forms:
      submission:
        subject: "New submission: %{form}"
        intro: "Someone sent the form “%{form}”:"
        no_answer: "(no answer)"
        sent_at: "Sent: %{time}"
        language: "Language: %{language}"
        page: "From the page: %{page}"
        no_page: "From no page that still exists."
