# The password reset's pages (docs/reference/i18n.md): `admin.passwords.new`
# and `admin.passwords.edit` are the lazy-lookup scopes of
# `app/views/admin/passwords/new.html.erb` and `edit.html.erb`, and the rest
# are `Admin::PasswordsController`'s.
en:
  admin:
    passwords:
      new:
        title: "Reset password"
        intro: "Enter the email you sign in with. We'll send a link to set a new password."
        email: "Email"
        submit: "Send reset link"
        # The same words for a known and an unknown address.
        sent_title: "Check your email"
        sent: "If that address belongs to an account, we've sent a link. It expires in 15 minutes."
        # Expired, used and invalid are one answer (a spent token is not
        # valid any more, and the page says nothing that tells them apart).
        expired_title: "This reset link has expired"
        expired: "This reset link has expired. Ask for a new one."
        request_new: "Send a new link"
        back: "← Back to sign in"

      edit:
        title: "Update your password"
        new_password: "New password"
        repeat: "Repeat new password"
        submit: "Set password"
        # The page was opened without the token: the link was cut short, or
        # the page was reloaded or come back to (the token is kept nowhere).
        incomplete: "This link is incomplete. Open the link in the email again, or ask for a new one."
        request_new: "Send a new link"
        back: "← Back to sign in"
        noscript: "Setting a new password needs JavaScript. Turn it on in your browser and open the link again."

      # Where a lapsed link sends someone when the site's mail does not work:
      # sign-in, with the one fact, since there is no request page to ask on.
      expired_without_mail: "This reset link has expired. Ask the site's owner to reset your password."
      # The flash on sign-in once the new password is set.
      reset: "Password has been reset."
      # Past the request form's rate limit.
      limited: "Try again later."
