# The password reset's pages (docs/reference/i18n.md): `admin.passwords.edit`
# is the lazy-lookup scope of `app/views/admin/passwords/edit.html.erb`.
#
# Only the strings that were added with the token's move out of the address
# are here. The rest of the sign-in and reset screens still hold their words
# in the views (they are not in `AdminI18nTest::CONVERTED` yet); `request_new`
# and `back` repeat what the request page's "expired" state says in its view,
# and move here with it.
en:
  admin:
    passwords:
      edit:
        # The page was opened without the token: the link was cut short, or
        # it is one from before the token moved, or the page was reloaded or
        # come back to (the token is kept nowhere).
        incomplete: "This link is incomplete. Open the link in the email again, or ask for a new one."
        request_new: "Send a new link"
        back: "← Back to sign in"
        noscript: "Setting a new password needs JavaScript. Turn it on in your browser and open the link again."

      new:
        # Expired, used and invalid are one answer (a used token is no longer
        # valid, and the page says nothing that tells them apart).
        expired_title: "This reset link has expired"
        expired: "This reset link has expired. Ask for a new one."
      # Where a lapsed link sends someone when the site's mail does not work:
      # sign-in, with the one fact, since there is no request page to ask on.
      expired_without_mail: "This reset link has expired. Ask the site's owner to reset your password."
