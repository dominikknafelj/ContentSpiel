# The Settings screen's Mail card (spec "Settings → Mail", design answer M2;
# docs/reference/mail.md): `admin.components.settings_screen.*` are its
# components' keys (docs/reference/i18n.md: one file per component folder).
# The screen's older cards still hold their words as literals; only the mail
# card and the encryption-keys sentence are keys so far.
#
# `admin.settings.*` are what the controllers and `Settings::Save` answer:
# toasts, the login's refusal, the sentence a site without encryption keys
# gets for the mail login and the AI key alike, and a host-set field's.
en:
  admin:
    components:
      settings_screen:
        mail_card:
          title: "Mail"
          intro: "Content Spiel sends two kinds of mail: password reset links and invites. Use the SMTP details from your mail provider."
          server: "Server"
          server_placeholder: "smtp.example.com"
          port: "Port"
          security: "Security"
          starttls: "STARTTLS"
          tls: "TLS"
          none: "None"
          sender_name: "Sender name"
          sender_address: "Sender address"
          sender_address_placeholder: "no-reply@yourdomain"
          set_by_host: "Set by the host"
          all_from_host: "These settings come from the host's environment."
        mail_login:
          heading: "Login"
          username: "Username"
          password: "Password"
          save: "Save login"
          cancel: "Cancel"
          set_on: "Set on %{date}"
          replace: "Replace"
          remove: "Remove…"
          set_by_host: "Set by the host"
          # Written into the login's entry while it holds text, and shown by
          # the footer in place of its Save (`admin--settings--mail`).
          hold: "Save or cancel the mail login first."
          remove_dialog:
            title: "Remove the mail login?"
            body: "Mail is sent without a login until a new one is saved."
            confirm: "Remove login"
        mail_test_result:
          send: "Send test mail"
          sending: "Sending…"
          sends_to: "Sends to %{address} (your address)"
          pending: "Save your changes first"
        mail_test_outcome:
          sent: "Test mail sent to %{address}. Check your inbox."
        mail_state:
          label: "Mail state"
        images_card:
          title: "Images"
          intro: "How the images of the library are made for the public site. Saving these settings changes no image; Regenerate images does."
          format: "Format"
          webp: "WebP"
          avif: "AVIF"
          format_help: "WebP is shown by every current browser. AVIF makes smaller files."
          avif_note: "Browsers too old to show AVIF will show nothing in place of an image."
          avif_unavailable: "AVIF is not available: this server cannot write it."
          image_quality_webp: "WebP quality"
          image_quality_avif: "AVIF quality"
          widths: "Widths"
          widths_placeholder: "480, 960, 1600, 2400"
          widths_help: "Pixels, separated by commas: %{count_min} to %{count_max} different widths, each from %{min} to %{max}. A larger width is made only for an image that is at least as wide."
          max_upload: "Largest upload"
          mb: "MB"
          no_images: "There are no images yet."
          progress:
            one: "%{made} of %{count} image made with these settings."
            other: "%{made} of %{count} images made with these settings."
          failed:
            one: "%{count} image could not be made. It is tried again when you regenerate."
            other: "%{count} images could not be made. They are tried again when you regenerate."
          regenerate_help: "Images are made again with the saved settings, a few at a time, so the site keeps its current ones until each is ready."
          regenerate: "Regenerate images…"
        images_dialog:
          title: "Regenerate images?"
          body:
            zero: "Every image is already made with the saved settings. Nothing will be made."
            one: "%{count} image is not made with the saved settings. It will be made again in the background; the site keeps its current one until it is ready."
            other: "%{count} images are not made with the saved settings. They will be made again in the background; the site keeps the current ones until each is ready."
          confirm: "Regenerate images"
    settings:
      mail_login:
        saved: "Mail login saved"
        removed: "Mail login removed"
        blank: "Enter a username or a password first."
      mail_test:
        too_many: "Too many test mails. Try again in a few minutes."
      regenerate_images:
        queued:
          zero: "No image needed regenerating."
          one: "Regenerating %{count} image."
          other: "Regenerating %{count} images."
      save:
        avif_unavailable: "AVIF can't be chosen: this server cannot write it."
        no_encryption_keys: "This site has no encryption keys, so a password can't be stored. See Hosting: encryption keys."
        set_by_host: "%{field} is set by the host and can't be changed here."
