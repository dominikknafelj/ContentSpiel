# The Settings screen's components (docs/reference/mail.md for the Mail
# card): `admin.components.settings_screen.*` are their keys
# (docs/reference/i18n.md: one file per component folder). A card still
# drawn with literals is one `test/lib/admin_i18n_test.rb` does not list.
# The screen's view and the controllers' answers are `admin.settings.*`, in
# `settings.en.yml`.
en:
  admin:
    components:
      settings_screen:
        # Each section's name, in the nav, on its card's heading and wherever
        # a section is named (`SettingsSections`).
        sections:
          site: "Site"
          languages: "Languages"
          publishing: "Publishing"
          forms: "Forms"
          ai: "AI translation"
          mail: "Mail"
          images: "Images"
        nav:
          label: "Settings sections"
        mail_card:
          intro: "Content Spiel sends two kinds of mail: password reset links and invites. Use the SMTP details from your mail provider."
          server: "Server"
          server_placeholder: "smtp.example.com"
          port: "Port"
          security: "Security"
          starttls: "STARTTLS"
          tls: "TLS"
          none: "None"
          sender_name: "Sender name"
          sender_address: "Sender address"
          sender_address_placeholder: "no-reply@yourdomain"
          set_by_host: "Set by the host"
          all_from_host: "These settings come from the host's environment."
        mail_login:
          heading: "Login"
          username: "Username"
          password: "Password"
          save: "Save login"
          cancel: "Cancel"
          set_on: "Set on %{date}"
          replace: "Replace"
          remove: "Remove…"
          set_by_host: "Set by the host"
          # Written into the login's entry while it holds text, and shown by
          # the footer in place of its Save (`admin--settings--mail`).
          hold: "Save or cancel the mail login first."
          remove_dialog:
            title: "Remove the mail login?"
            body: "Mail is sent without a login until a new one is saved."
            confirm: "Remove login"
        mail_test_result:
          send: "Send test mail"
          sending: "Sending…"
          sends_to: "Sends to %{address} (your address)"
          pending: "Save your changes first"
        mail_test_outcome:
          sent: "Test mail sent to %{address}. Check your inbox."
        mail_state:
          label: "Mail state"
        # `Admin::SettingsScreen::AiState`'s words, one per state: the key's
        # chip, Test connection's result and the rail say them alike.
        ai_state:
          "off": "Off"
          no_key: "No key"
          key_saved: "Key saved"
          connected: "Connected"
          not_connected: "Not connected"
        ai_test_result:
          time: "%{milliseconds} ms"
        forms_card:
          keep_label: "Keep submissions for"
          days: "days."
          help: "Forms that keep submissions and don't set their own time keep them this long. A change applies to submissions already kept."
        images_card:
          intro: "How the images of the library are made for the public site. Saving these settings changes no image; Regenerate images does."
          format: "Format"
          webp: "WebP"
          avif: "AVIF"
          format_help: "WebP is shown by every current browser. AVIF makes smaller files."
          avif_note: "Smaller files, slower to make; very old browsers show no image. Animated images are always made in WebP, at the WebP quality."
          avif_unavailable: "AVIF is not available: this server cannot write it."
          image_quality_webp: "WebP quality"
          image_quality_avif: "AVIF quality"
          widths: "Widths"
          widths_placeholder: "480, 960, 1600, 2400"
          widths_help: "Pixels, separated by commas: %{count_min} to %{count_max} different widths, each from %{min} to %{max}. A larger width is made only for an image that is at least as wide."
          max_upload: "Largest upload"
          mb: "MB"
          no_images: "There are no images yet."
          progress:
            one: "%{count} image was made with other settings"
            other: "%{count} images were made with other settings"
          failed:
            one: "%{count} could not be made"
            other: "%{count} could not be made"
          regenerate_help: "Images are made again with the saved settings, a few at a time, so the site keeps its current ones until each is ready."
          regenerate: "Regenerate images…"
        images_dialog:
          title: "Regenerate images?"
          body:
            zero: "Every image is already made with the saved settings. Nothing will be made."
            one: "Remake %{count} image? This runs in the background and can take a few minutes."
            other: "Remake %{count} images? This runs in the background and can take a few minutes."
          confirm: "Regenerate images"
