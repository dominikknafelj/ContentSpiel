# CS Studio's schema field inputs, `app/components/admin/fields/` (docs/reference/i18n.md).
# Keys are `admin.components.fields.<class name without Admin::Fields::, underscored>`.
# YAML: a value with a `%{...}` in it is double-quoted.
en:
  admin:
    components:
      fields:
        # Under a code field, from nine tenths of its limit: "18,412 of 20,000
        # characters", and over it "20,412 of 20,000 characters · 412 over".
        # Every number arrives formatted for the reader's language. The server
        # writes the line once and `admin--editor--code-limit` keeps it
        # current, and says it once, politely, when it appears and when the
        # text passes the limit.
        code_field:
          count: "%{used} of %{limit} characters"
          over: "%{used} of %{limit} characters · %{over} over"
        # The Diagram block's source (`Admin::Fields::MermaidField`) and its
        # preview (EditorDiagramBlock, EditorDiagramError), shown by
        # `admin--diagram--preview`. The counter's two lines are the Code
        # field's words: the server draws these, and the counter's script
        # (`admin--editor--code-limit`) the Code field's own. A refused line,
        # an unsupported type and a first line that names none are said in
        # the server's own sentences,
        # `errors.messages.diagram_*` (config/locales/en.yml), which the
        # component hands the script under `refused.*`, `unsupported` and
        # `no_type`: they are not written here.
        mermaid_field:
          count: "%{used} of %{limit} characters"
          over: "%{used} of %{limit} characters · %{over} over"
          frame_title: Diagram preview
          empty: Type a diagram to see it drawn.
          drawing: Drawing…
          no_description: The site shows this diagram once it has a description.
          starting: "Starts from the %{language} diagram. It becomes this language's own when you change it."
          error_lead: "This diagram doesn't draw:"
          kept: The site keeps the last drawing that worked.
          nothing_yet: Nothing is drawn yet.
          kept_badge: Last drawing that worked
          # The frame's two refusals before and after Mermaid draws: a source
          # over its limit, and a drawing over the size the site keeps.
          too_long: "This diagram is too long to draw. Shorten it to %{limit} characters or fewer."
          too_large: This diagram is too large to keep. Shorten it or split it in two.
          # Import file…: a .mmd file, or a .md file's first mermaid fence,
          # read in the browser into the source. `replace_*` is the
          # confirmation a source that isn't empty asks first.
          import: Import file…
          imported: Imported from %{file}.
          import_first_only: Only the first diagram in %{file} was imported.
          import_no_mermaid: "%{file} holds no Mermaid diagram. A .md file needs a ```mermaid fence."
          import_too_long: "%{file} is too long: its diagram has %{count} characters, and the limit is %{limit}."
          import_unreadable: "%{file} couldn't be read. Use a .mmd or .md text file."
          replace_title: Replace the source?
          replace_body: The diagram in Source is replaced by the one in %{file}. The site keeps the last drawing that worked until the new one draws.
          replace_confirm: Replace source
        # A link field's other half: a page or a post chosen by its title
        # (`Admin::Fields::LinkField`). `unavailable` is one answer for a target
        # outside the viewer's scope, in the trash or gone: it must tell none.
        link_field:
          chosen: Linked page or post
          clear: Clear
          not_public: Not public at the moment, so the card draws no link.
          search: Or search pages and posts…
          unavailable: A page or post you can't open here
          untitled: Untitled
        # The Form block's form (`Admin::Fields::FormField`): the empty
        # choice, and a stored form that is no longer kept (in the trash, or
        # purged), which the public page draws nothing for.
        form_field:
          choose: Choose a form
          gone: A form that's gone
        # A theme's choices (`theme.yml`): the empty choice of a style list
        # and of an icon list, and a stored name the theme does not declare.
        theme_choice_field:
          default: Default
          no_icon: No icon
          not_in_theme: "%{name} (not in this theme)"
