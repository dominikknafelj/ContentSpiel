# CS Studio's schema field inputs, `app/components/admin/fields/` (docs/reference/i18n.md).
# Keys are `admin.components.fields.<class name without Admin::Fields::, underscored>`.
# YAML: a value with a `%{...}` in it is double-quoted.
en:
  admin:
    components:
      fields:
        # Under a code field, from nine tenths of its limit: "18,412 of 20,000
        # characters", and over it "20,412 of 20,000 characters · 412 over".
        # Every number arrives formatted for the reader's language. The server
        # writes the line once and `admin--editor--code-limit` keeps it
        # current, and says it once, politely, when it appears and when the
        # text passes the limit.
        code_field:
          count: "%{used} of %{limit} characters"
          over: "%{used} of %{limit} characters · %{over} over"
        # A link field's other half: a page or a post chosen by its title
        # (`Admin::Fields::LinkField`). `unavailable` is one answer for a target
        # outside the viewer's scope, in the trash or gone: it must tell none.
        link_field:
          chosen: Linked page or post
          clear: Clear
          not_public: Not public at the moment, so the card draws no link.
          search: Or search pages and posts…
          unavailable: A page or post you can't open here
          untitled: Untitled
        # A theme's choices (`theme.yml`): the empty choice of a style list
        # and of an icon list, and a stored name the theme does not declare.
        theme_choice_field:
          default: Default
          no_icon: No icon
          not_in_theme: "%{name} (not in this theme)"
