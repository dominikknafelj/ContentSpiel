# CS Studio's shared components (docs/reference/i18n.md). A component's keys are
# `admin.components.<its class name without Admin:: and Component, underscored,
# one segment per namespace>`: `Admin::ConfirmDialogComponent#t(".cancel")`
# reads `admin.components.confirm_dialog.cancel`. Strings a script shows sit
# here too, beside the component whose server-rendered text they repeat, and
# reach the script through `messages_data` (`app/helpers/admin/messages_helper.rb`)
# -- one key for the server's render and the script's, so they cannot drift.
#
# YAML: a value with a leading or trailing space, a `%{...}`, a `:` or a
# glyph that opens a YAML token (a bullet, `·`) is double-quoted.
en:
  admin:
    components:
      dialog:
        close: "Close"

      confirm_dialog:
        cancel: "Cancel"

      toast:
        dismiss: "Dismiss"
        # What the layout's `<template id="toast-error-template">` is cloned
        # with when a save got no answer at all, and the two sentences a
        # script puts into a clone of it (`autosave/order_request.js`,
        # `autosave/queue.js`).
        save_failed: "Couldn't save."
        order_failed: "Couldn't save the new order. Check your connection and try again."
        dropped: "That didn't go through — the screen changed. Try again."

      save_bar:
        save: "Save"
        cancel: "Cancel"
        # The footer's count line, written by `admin--save-bar`.
        changes:
          one: "%{count} unsaved change"
          other: "%{count} unsaved changes"
        unsaved: "Unsaved changes"
        no_changes: "No unsaved changes"
        # Shown while another form on the screen has to be saved first; also
        # `admin--pending-lock`'s hint on an instant action.
        blocked: "Save or cancel your changes first."

      save_status:
        saving: "SAVING…"
        saving_live: "SAVING TO SITE…"
        saved: "SAVED"
        saved_at: "SAVED %{time}"
        saved_live: "● SAVED TO SITE"
        saved_live_at: "● SAVED TO SITE %{time}"
        error:
          one: "Couldn't save — %{count} problem"
          other: "Couldn't save — %{count} problems"
        forbidden: "Not saved — you don't have permission to change this"
        retrying: "NOT SAVED · RETRYING…"
        offline: "NOT SAVED · "
        stale: "● CHANGED ELSEWHERE"
        saved_over: "SAVED · ALSO CHANGED ELSEWHERE — RELOAD TO SEE THE LATEST"
        signed_out: "Signed out — sign in again to keep saving"
        retry: "Retry"

      status_chip:
        labels:
          draft: "Draft"
          scheduled: "Scheduled"
          live: "Live"

      translation_chip:
        state:
          complete: "translated"
          missing: "not translated"
          outdated: "outdated"
        aria_label:
          complete: "%{language}: translated"
          missing: "%{language}: not translated"
          outdated: "%{language}: outdated"
        tooltip:
          complete: "Translated"
          missing: "Not translated"
          outdated: "%{language} changed since translation"

      language_tabs:
        nav_label: "Languages"
        missing_title: "Missing required fields"
        missing: "%{language}: not translated"
        outdated_title: "Original changed"
        outdated: "%{language}: original changed"
        more: "+%{count} ▾"

      pagination:
        nav_label: "Pagination"
        range: "%{first}–%{last} OF %{total}"
        previous: "Previous"
        next: "Next"

      time_ago:
        just_now: "just now"
        minutes_ago:
          one: "%{count}m ago"
          other: "%{count}m ago"
        hours_ago:
          one: "%{count}h ago"
          other: "%{count}h ago"
        yesterday: "yesterday"
        days_ago:
          one: "%{count}d ago"
          other: "%{count}d ago"

      error_summary:
        heading:
          one: "%{count} thing needs fixing"
          other: "%{count} things need fixing"

      chip_input:
        # What the chips are called, by the caller's `noun:` -- `one` where a
        # sentence names one ("Create tag ..."), `other` where it names
        # several ("No matching tags."). A new noun is a new entry here.
        nouns:
          tag:
            one: "tag"
            other: "tags"
          user:
            one: "user"
            other: "users"
          post:
            one: "post"
            other: "posts"
        remove: "Remove %{label}"
        invalid: "(invalid)"
        untitled: "(untitled)"
        too_long: "(too long)"
        suggestions_label: "%{label} suggestions"
        no_matches: "No matching %{noun}."
        results:
          one: "%{count} suggestion."
          other: "%{count} suggestions."
        create: "Create %{noun} “%{label}”"
        search_failed: "Search failed — try again."
        already_added: "%{label} is already added."
        added: "Added %{label}."
        removed: "Removed %{label}."

    # The admin layout (`app/views/layouts/admin.html.erb`). A layout's lazy
    # lookup would read `layouts.admin.*`, outside the `admin` file tree, so the
    # layout writes these keys out in full.
    layout:
      # The page title when a screen sets none.
      title: "CS Studio"
      leave_dialog:
        title: "Leave without saving?"
        # `admin--save-bar` writes the sentence as it opens the dialog:
        # `body` where nothing is counted (a form the server re-rendered
        # with errors), `body_with_count` otherwise.
        body: "You have unsaved changes on this screen."
        body_with_count:
          one: "You have %{count} unsaved change on this screen."
          other: "You have %{count} unsaved changes on this screen."
        discard: "Discard changes"
        keep_editing: "Keep editing"
