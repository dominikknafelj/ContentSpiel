# The Mind graph (docs/reference/i18n.md): `admin.mind_graph.show` is the
# view's own lazy-lookup scope, `script` what `mind_graph/app.js` and its
# modules show (handed over through the element's `data-messages`).
#
# `show.canvas_label` names the canvas until the data has arrived, and is the
# summary's first words. `script.summary.*` is the name it has afterwards
# (`mind_graph/summary.js`; design answers G6 and H5): WHOLE SENTENCES and
# the parts of one, and the script puts one space between two sentences and
# nothing else of its own. "Mind graph: 9 pages, 3 post types, 13 posts and 4
# tags, 27 connections. Showing everything." is `whole`, then `everything`;
# "Mind graph around Blog, depth 2: 7 pages, 1 post type and 20 of 112 posts.
# 92 more are in the list." is `local`, then `more`. A kind that is switched
# off adds its `hidden` sentence and a kind of line its `hidden_lines` one
# ("Showing everything. Tags hidden." are both said, in that order:
# "everything" means no cap, not no filters). With nothing in view the name
# is `nothing`, then `all_hidden` when every kind is switched off or
# `none_yet` when there is nothing to draw. In the view the 3,000-line rule
# opened, `around_home` and `site` follow ("Showing the area around Home. The
# site has 212 pages, 2,040 posts and 64 tags."). `%{kinds}` is the counts of
# what is in view, joined by `pair` and `series` (so there is no comma before
# "and", and another language can join otherwise); `%{figure}` is a count as
# the sentence's language groups it, `count` only chooses the form.
# `script.legend.toggle` is a toggle's whole accessible name once its count
# is known ("Pages, 200").
#
# `script.list.select_page`, `select_post`, `select_tag` and `select_type` are
# a row's WHOLE accessible name, so the script never joins two strings with
# punctuation of its own: what it is, how connected (a post type: how many
# posts it has, the number its row shows), and what pressing it does.
# `script.list.add_post` is the whole name of a row whose post the canvas
# does not draw, the design answer's sentence (G5): `%{type}` is the post
# TYPE's label in lower case, so the row says "blog post" and never a bare
# "post"; `add_retired_post` is its form for a post of a type that is no
# longer registered (H7: "talk, retired type"), where `%{type}` is the
# stored name in lower case. `not_in_view` stands where such a row's count
# would. `script.list.pages`, `posts`, `tags` and `types` are a group's
# heading with how many it holds; `posts` is also the heading of the rows a
# filter shows ("Not listed on any page", a "+N more" pill), where the
# figure is the read's whole total. `failed` and `try_again` are the design
# answer's too (G5): a read of the list's that failed, said in the list.
#
# `script.search.groups.*` head the three groups of the search's results.
#
# `show.zoom_out`, `zoom_in` and `fit` are the zoom buttons' whole names (their
# `aria-label` and tooltip); what is drawn on them is a glyph, or `fit_short`.
#
# `script.capped` is the global view's sentence (it keeps the best-connected
# posts), `script.capped_local` a local view's (it keeps the nearest to the
# focus). In `script.isolated`, `%{figure}` is the count as the sentence's
# language groups it ("1,214"), handed over by the script; `count` only
# chooses the form.
#
# `script.all_posts` names the one node a list block with no filter points
# at. `script.more` is a "+N more" pill's words: `%{count}` is the figure as
# the script has already grouped it ("+1,980 more"), not a plural's number,
# because the words have one form. `script.retired_type` is the whole label
# of the hub of a post type that is no longer registered.
