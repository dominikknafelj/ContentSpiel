# The Mind graph (docs/reference/i18n.md): `admin.mind_graph.show` is the
# view's own lazy-lookup scope, `script` what `mind_graph/app.js` and its
# modules show (handed over through the element's `data-messages`).
#
# `show.canvas_label` names the canvas until the data has arrived; `script.
# summary` is the whole name it has afterwards (the same words, then what is
# drawn), so the script never joins two strings with punctuation of its own;
# `script.list.select_post` and `select_tag` are a row's whole accessible name
# for the same reason: what it is, how connected, and what pressing it does.
# `script.list.posts` and `tags` are a group's heading with how many it holds.
#
# `show.zoom_out`, `zoom_in` and `fit` are the zoom buttons' whole names (their
# `aria-label` and tooltip); what is drawn on them is a glyph, or `fit_short`.
#
# `script.capped` is the global view's sentence (it keeps the best-connected
# posts), `script.capped_local` a local view's (it keeps the nearest to the
# focus). In `script.isolated`, `%{figure}` is the count as the sentence's
# language groups it ("1,214"), handed over by the script; `count` only
# chooses the form.
#
# `script.all_posts` names the one node a list block with no filter points
# at. `script.more` is a "+N more" pill's words: `%{count}` is the figure as
# the script has already grouped it ("+1,980 more"), not a plural's number,
# because the words have one form. `script.retired_type` is the whole label
# of the hub of a post type that is no longer registered.
