# The System status screen's components, `app/components/admin/system_status_screen/`
# (docs/reference/i18n.md). Keys are `admin.components.system_status_screen.<component>`.
# The sentences word `Alerts::Alert#sentence`'s data as the digest mail does
# (`mail.alerts_mailer.digest.sentences`), with this card's own keys.
en:
  admin:
    components:
      system_status_screen:
        # `Admin::SystemStatusScreen::AlertsComponent`, the Alerts card.
        alerts:
          title: "Alerts"
          line: "The last 7 days, newest first. Not part of the checks."
          none: "No alerts in the last 7 days."
          # The notice while outgoing mail is not working, by its state.
          mail_off: "Owners can't be mailed about these: outgoing mail is not set up."
          mail_untested: "Alerts wait until outgoing mail works: it is saved but not tested."
          mail_failed: "Alerts wait until outgoing mail works: the last send failed."
          open_mail: "Open Mail settings →"
          address_off: "Owners can't be mailed about these: the site has no address for the mail to link to. Set PUBLIC_HOST to the site's address."
        # `Admin::SystemStatusScreen::AlertRowComponent`, one alert.
        alert_row:
          error: "Error"
          security: "Security"
          backups: "Backups"
          # Between an error's class and its place, both drawn as code.
          in: "in"
          # How often the alert itself was raised, never the events inside
          # one: a window alert once, an error once per report.
          count:
            one: "Seen once"
            other: "Seen %{count} times"
          last_today: "last %{time} today"
          last_yesterday: "last %{time} yesterday"
          last_on: "last %{time}"
          mailed: "Mailed %{time}"
          not_mailed: "Not mailed yet"
          no_mail: "Not mailed: outgoing mail is not set up"
          no_mail_untested: "Not mailed: mail is not tested yet"
          no_mail_failed: "Not mailed: the last send failed"
          no_address: "Not mailed: the site has no address"
          # The log narrowed to the alert's own events, never the whole log.
          audit: "Show in audit log →"
          sentences:
            sign_in_failures: "%{failed} failed sign-ins in %{minutes} minutes"
            owner_made: "%{subject_label} was made an owner"
            owner_made_by: "%{subject_label} was made an owner by %{actor_name}"
            owner_removed: "%{subject_label} is no longer an owner"
            owner_removed_by: "%{subject_label} is no longer an owner, by %{actor_name}"
            token_issued: "API token “%{token_name}” issued"
            token_issued_by: "API token “%{token_name}” issued by %{actor_name}"
            access_denied_burst:
              one: "%{denied} actions refused in %{minutes} minutes, by one account"
              other: "%{denied} actions refused in %{minutes} minutes, by %{count} accounts"
            request_limited:
              one: "A limit on requests was reached once in %{minutes} minutes: %{limits}"
              other: "Limits on requests were reached %{count} times in %{minutes} minutes: %{limits}"
            backup_stale: "No good backup for %{hours} hours"
            backup_never: "No backup has succeeded in the %{hours} hours since backups were set up"
            backup_check_failed: "The monthly check of the backups failed"
