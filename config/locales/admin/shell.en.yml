# CS Studio's shell, the components in `app/components/admin/shell/`
# (docs/reference/i18n.md). A component's keys are
# `admin.components.shell.<its class name without Admin::Shell:: and Component, underscored>`.
# The sidebar, the top bar and the tree column's parts are converted; the
# palette still holds its English as literals and moves here with the rest of
# the shell (`CONVERTED` in test/lib/admin_i18n_test.rb).
#
# `admin.modules` and `admin.module_groups` are the names of the modules
# registered in `StudioModules` and of the sidebar's groups, one key per
# module name (`StudioModules::Entry#label`); ⌘K finds a module by the same
# words.
en:
  admin:
    modules:
      dashboard: "Dashboard"
      pages: "Pages"
      posts: "Posts"
      media: "Media"
      forms: "Forms"
      translations: "Translations"
      tags: "Tags"
      mind_graph: "Mind graph"
      trash: "Trash"
      users: "Users"
      groups: "Groups"
      settings: "Settings"
      ai_assistant: "AI assistant"
      system_status: "System status"
      audit_log: "Audit log"
    # The name of a sidebar link whose badge is addressed to the viewer: the
    # words it shows, in the order they stand ("Dashboard" and "2" read "Dashboard, 2 new").
    shell:
      nav:
        unread_count: "%{label}, %{count} new"
    module_groups:
      content: "Content"
      people: "People"
      system: "System"
    components:
      shell:
        sidebar:
          # The column's accessible name.
          label: "Modules"
          # The product's wordmark, drawn in capitals as the brand draws it.
          wordmark: "CONTENT·SPIEL"
          # The button that opens ⌘K, and the key that opens it from anywhere.
          jump: "Jump to…"
          shortcut: "⌘K"
          sign_out: "Sign out"
        top_bar:
          # The button that opens the modules drawer (its name).
          navigation: "Open navigation"
          # The product's wordmark, drawn in capitals as the brand draws it.
          wordmark: "CONTENT·SPIEL"
          # The button that opens ⌘K (its name), and the key it shows.
          jump: "Jump to…"
          shortcut: "⌘K"
        # The words of what the tree column holds, one family per subject
        # (`Admin::Shell::TreeSubjects`), read by every part the shell draws
        # for the column:
        # - `hide`: the column head's button that folds it to its strip, and
        #   `show`: the strip's one button, which unfolds it (each the
        #   button's name and the shared tooltip's text);
        # - `open`: the top bar's button that opens the column as a drawer
        #   (its name), and `button`: the words it shows;
        # - `divider`: the separator's accessible name, whose value (the
        #   width in pixels) is read after it, and `divider_tooltip`: the
        #   shared tooltip on keyboard focus and hover, which the script
        #   writes again with the current width (`admin--shell--tree-width`).
        tree_subject:
          pages:
            hide: "Hide page tree"
            show: "Show page tree"
            open: "Open page tree"
            button: "Pages ▾"
            divider: "Page tree width"
            divider_tooltip: "Tree width %{width}px. Arrow keys to resize."
          mind_graph:
            hide: "Hide list"
            show: "Show list"
            open: "Open list"
            button: "List ▾"
            divider: "List width"
            divider_tooltip: "List width %{width}px. Arrow keys to resize."
