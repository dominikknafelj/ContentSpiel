# "Your account" (docs/reference/i18n.md): `admin/accounts/edit.html.erb` and
# `Admin::AccountsController`, read with full keys; the sidebar's account
# block reads `title` too. The Notes card's keys, `admin.accounts.notes`, are
# notes' wording on this screen and stay in `notes.en.yml`.
en:
  admin:
    accounts:
      # The screen's heading, its title in the browser's tab and the
      # sidebar's entry that leads to it: one name for the one place.
      title: "Your account"
      # The first form's toast: the app's own "Settings saved" (no full stop,
      # as on the Settings screen).
      saved: "Settings saved"
      profile:
        title: "Profile"
        name: "Your name"
      # The third card: the password form, with what a change does to the
      # person's sessions under its title.
      password:
        title: "Password"
        sessions: "You'll stay signed in here. Other sessions are signed out."
        current: "Current password"
        new: "New password"
        confirmation: "Confirm new password"
        # The card's own footer: its Save, and the reset flow's link.
        submit: "Change password"
        forgot: "Forgot your current password?"
        # The form's answer, said in the card, where the form is.
        changed: "Password changed. Your other sessions were signed out."
        limited: "Try again later."
      # Your account's Sessions card (`Admin::AccountScreen::SessionsCardComponent`).
      sessions:
        title: "Sessions"
        intro: "Where you're signed in. End a session you don't recognise, then change your password."
        this_session: "This session"
        device: "%{browser} on %{os}"
        browser_only: "%{browser}"
        os_only: "A browser on %{os}"
        unknown_device: "Unknown browser"
        active: "Active %{time}"
        active_now: "Active now"
        signed_in_with:
          password: "Signed in with password"
          passkey: "Signed in with a passkey"
          sso: "Signed in with single sign-on"
          recovery_code: "Signed in with a recovery code"
        end: "End"
        end_label: "End the session in %{device}"
        others:
          one: "1 other session"
          other: "%{count} other sessions"
        none_else: "You're not signed in anywhere else."
        end_others: "Sign out everywhere else…"
        end_others_title: "Sign out everywhere else?"
        end_others_body:
          one: "Your other session ends, and that browser must sign in again. You stay signed in here."
          other: "Your %{count} other sessions end, and those browsers must sign in again. You stay signed in here."
        end_others_confirm: "Sign out everywhere else"
        ended: "Session ended."
        already_ended: "That session had already ended."
        ended_others:
          one: "Signed out of 1 other session."
          other: "Signed out of %{count} other sessions."
