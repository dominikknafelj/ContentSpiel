# CS Studio's shared building blocks, the components in `app/components/admin/ui/`
# (docs/reference/i18n.md); every other component folder has its own file,
# `config/locales/admin/<folder>.en.yml`. A component's keys are
# `admin.components.ui.<its class name without Admin::Ui:: and Component, underscored>`:
# `Admin::Ui::ConfirmDialogComponent#t(".cancel")` reads
# `admin.components.ui.confirm_dialog.cancel`. Strings a script shows sit here too,
# beside the component whose server-rendered text they repeat, and reach the script
# through `messages_data` (`app/helpers/admin/messages_helper.rb`) -- one key for the
# server's render and the script's, so they cannot drift.
#
# YAML: a value with a leading or trailing space, a `%{...}`, a `:` or a
# glyph that opens a YAML token (a bullet, `·`) is double-quoted.
en:
  admin:
    components:
      ui:
        dialog:
          close: "Close"

        confirm_dialog:
          cancel: "Cancel"

        # Confirm it's you, before a change to how a person signs in (Your
        # account, enrolment). `wrong_password`, `passkey_failed` and `limited`
        # are the confirmation's answers, which the dialog shows as they come.
        confirm_identity_dialog:
          title: "Confirm it's you"
          lead_passkey: "To change how you sign in, confirm with your passkey or your password."
          lead_password: "To change how you sign in, confirm with your password."
          use_passkey: "Use your passkey"
          password: "Password"
          confirm_password: "Confirm with password"
          confirm: "Confirm"
          cancel: "Cancel"
          passkey_failed: "That passkey didn't work. Try again, or use your password."
          wrong_password: "That password isn't right."
          limited: "Try again in a few minutes."

        # The "or" between two ways in: the sign-in panel, Confirm it's you
        # and the invitation page.
        or_divider:
          or: "or"

        # The recovery codes block, shown once (enrolment, the wizard, new codes).
        recovery_codes:
          title: "Save your recovery codes"
          body: "Each code signs you in once when your passkeys aren't at hand. This is the only time they're shown: keep them somewhere safe, apart from your devices."
          list_label: "Recovery codes"
          copy: "Copy codes"
          download: "Download"
          saved: "I have saved these codes"
          done: "Done"

        # The "+N" circle's letters: `many` past nine, where three characters
        # would not stand in the circle.
        avatar:
          more: "+%{count}"
          many: "9+"

        # An unread count says "new" in words as well as in its fill; the
        # bubble's name is its caller's (`label:`).
        note_marker:
          unread: "%{count} new"

        # Shown on sign-in, on the password pages and in the shell when CS
        # Studio is reached over plain HTTP in production. `PUBLIC_HOST` is the
        # environment variable's name and is not translated.
        insecure_notice:
          body: "This connection is not encrypted. Passwords and sessions can be read on the way. Set PUBLIC_HOST to an https address."

        # The dashboard's alert while mail's last send failed; the sentence is
        # `MailStateSentence`'s (config/locales/admin/mail.en.yml).
        mail_failed_notice:
          open_settings: "Open Mail settings →"

        # A system check's row, on System status and in the setup wizard.
        system_check_row:
          ok: "OK"
          warning: "Warning"
          "off": "Off"
          copy_label: "Copy command for %{label}"
          open_mail_settings: "Open Mail settings →"
          open_image_settings: "Open Image settings →"
          open_forms: "Open Forms →"
          learn_more: "Learn more →"

        # The copy box's button, and what `admin--ui--clipboard` says after a
        # press (`copied`, or `failed` on the button and `selected` in the
        # status when the clipboard refused). All four are on
        # <body> too (`SCRIPT_MESSAGES`), for the editor header's Copy.
        copy_value:
          copy: "Copy"
          copied: "Copied"
          failed: "Copy failed"
          selected: "Couldn't copy automatically — the text is selected, press Ctrl+C (⌘C on a Mac)."

        toast:
          dismiss: "Dismiss"
          # What the layout's `<template id="toast-error-template">` is cloned
          # with when a save got no answer at all, and the two sentences a
          # script puts into a clone of it (`saving/order_request.js`,
          # `saving/promotion_hold.js`).
          save_failed: "Couldn't save."
          order_failed: "Couldn't save the new order. Check your connection and try again."
          dropped: "That didn't go through — the screen changed. Try again."

        save_bar:
          # The default Save; a screen with a word of its own ("Save group")
          # hands it in as `save_label:`.
          save_changes: "Save changes"
          # The way out that throws the changes away without asking.
          discard: "Discard"
          # The footer's count line, written by `admin--saving--save-bar`:
          # the count, then the names of what changed, at most three
          # (`NAMES_SHOWN`) and how many more, joined by the separator.
          changes:
            one: "%{count} unsaved change"
            other: "%{count} unsaved changes"
          names: "%{changes} · %{names}"
          more:
            one: "%{names} and 1 more"
            other: "%{names} and %{count} more"
          separator: ", "
          # The name of a field kept per language ("Deutsch: Title"), the
          # language as the language tabs write it. Read by the server.
          per_language: "%{language}: %{label}"
          # The changed mark on a list's heading (the Languages card's order),
          # said to a screen reader.
          order_changed: "Language order changed"
          unsaved: "Unsaved changes"
          no_changes: "No unsaved changes"
          # Shown while another form on the screen has to be saved first; also
          # `admin--saving--pending-lock`'s hint on an instant action, and the
          # AI card's while a test waits for a save.
          blocked: "Save or discard your changes first."

        save_status:
          saving: "SAVING…"
          # A published or scheduled record: a save is not a publication.
          saving_live: "SAVING…"
          saved: "SAVED"
          saved_at: "SAVED %{time}"
          saved_live: "SAVED · NOT PUBLISHED"
          saved_live_at: "SAVED · NOT PUBLISHED %{time}"
          error:
            one: "Couldn't save — %{count} problem"
            other: "Couldn't save — %{count} problems"
          forbidden: "Not saved — you don't have permission to change this"
          retrying: "NOT SAVED · RETRYING…"
          offline: "NOT SAVED · "
          stale: "● CHANGED ELSEWHERE"
          held: "● NOT SAVED · %{name} IS EDITING"
          held_own_tab: "● NOT SAVED · OPEN IN YOUR OTHER TAB"
          held_unknown: "● NOT SAVED · SOMEONE ELSE IS EDITING"
          saved_over: "SAVED · ALSO CHANGED ELSEWHERE — RELOAD TO SEE THE LATEST"
          signed_out: "Signed out — sign in again to keep saving"
          retry: "Retry"

        status_chip:
          labels:
            draft: "Draft"
            scheduled: "Scheduled"
            live: "Live"

        # The rows of a published or scheduled record have moved on from what
        # the site shows. The compact form (the page tree)
        # is a dot, so its label is also the dot's name for a screen reader.
        unpublished_chip:
          label: "Unpublished changes"

        # One translation vocabulary in CS Studio: Missing, Outdated,
        # Translated. The outdated tooltip keeps its sentence, since it names
        # the language to compare with.
        translation_chip:
          aria_label:
            complete: "%{language}: translated"
            missing: "%{language}: missing"
            outdated: "%{language}: outdated"
          tooltip:
            complete: "Translated"
            missing: "Missing"
            outdated: "%{language} changed since translation"

        language_tabs:
          nav_label: "Languages"
          missing_title: "Missing required fields"
          missing: "%{language}: missing"
          outdated_title: "Outdated"
          outdated: "%{language}: outdated"
          more: "+%{count} ▾"

        # A word diff's screen-reader cues, each before its word.
        word_diff:
          removed: "Removed: "
          added: "Added: "

        # One language's progress, on the Dashboard and the Translations
        # tiles: the bar's name after the language's own name, then the
        # counts, outdated first, or "All translated".
        language_progress:
          progress_label: "%{language} translated"
          all_translated: "All translated"
          outdated:
            one: "%{count} outdated"
            other: "%{count} outdated"
          missing:
            one: "%{count} missing"
            other: "%{count} missing"

        # The accessible name of an editor rail's tablist; each tab's own
        # words are its editor's.
        rail_tabs:
          label: "Settings"

        # The one media picker every image field and the rich-text editor's
        # Image button open. `none` and `selected` are also
        # `admin--media--select`'s, from the dialog's `data-messages`.
        media_picker:
          title: "Choose an image"
          upload: "Upload"
          close: "Close"
          file: "Image file"
          none: "No image selected"
          selected: "1 selected"
          cancel: "Cancel"
          use: "Use image"

        pagination:
          nav_label: "Pagination"
          range: "%{first}–%{last} of %{total}"
          previous: "Previous"
          next: "Next"

        time_ago:
          just_now: "just now"
          minutes_ago:
            one: "%{count}m ago"
            other: "%{count}m ago"
          hours_ago:
            one: "%{count}h ago"
            other: "%{count}h ago"
          yesterday: "yesterday"
          days_ago:
            one: "%{count}d ago"
            other: "%{count}d ago"

        error_summary:
          # A field's name and the model's message, in the order a language wants.
          sentence: "%{field} %{message}"
          heading:
            one: "%{count} thing needs fixing"
            other: "%{count} things need fixing"

        password_field:
          # The toggle's words are its state: what pressing it does.
          show: "Show"
          hide: "Hide"
          # The line under the meter before anything is typed; `%{count}` is
          # `User::MINIMUM_PASSWORD_LENGTH`, the server's own rule.
          minimum: "Use at least %{count} characters."
          # What `password-field` writes under the bars as a password is
          # typed (`data-messages` on the field), one sentence per level.
          strength:
            too_short: "Too short. Use %{count} or more characters."
            fair: "Fair. A few unrelated words work well."
            good: "Good."
            strong: "Strong."

        chip_input:
          # The two sentences that name what the chips are, by the caller's
          # `noun:`, each whole so a translator can inflect the noun in it. A new
          # noun is a new entry here.
          nouns:
            tag:
              no_matches: "No matching tags."
              create: "Create tag “%{label}”"
            user:
              no_matches: "No matching users."
              create: "Create user “%{label}”"
            post:
              no_matches: "No matching posts."
              create: "Create post “%{label}”"
          remove: "Remove %{label}"
          invalid: "(invalid)"
          untitled: "(untitled)"
          too_long: "(too long)"
          suggestions_label: "%{label} suggestions"
          results:
            one: "%{count} suggestion."
            other: "%{count} suggestions."
          search_failed: "Search failed — try again."
          already_added: "%{label} is already added."
          added: "Added %{label}."
          removed: "Removed %{label}."

        tree_item:
          # A parent's disclosure, named by what pressing it does to the branch.
          fold: "Fold %{title}"
          unfold: "Unfold %{title}"

        # The find field at the top of a tree column, in the words of what the
        # tree holds (`noun:`): Pages' pages, or the graph's pages, posts and
        # tags.
        tree_find:
          label:
            pages: "Find a page"
            nodes: "Find a page, post or tag"
          placeholder:
            pages: "Find a page"
            nodes: "Find a page, post or tag"
          count:
            pages:
              one: "1 page matches"
              other: "%{count} pages match"
            nodes:
              one: "1 match"
              other: "%{count} matches"
          none:
            pages: "No pages match"
            nodes: "Nothing matches"
          # Said under the count while the tree is narrowed, where its rows move.
          no_moving: "Clear the search to move pages"
          clear: "Clear"

        # The three-way theme control in CS Studio's sidebar, the setup
        # wizard and the sign-in pages: the group's name and its choices.
        # Auto follows the operating system's light or dark setting.
        theme_switch:
          label: "Theme"
          light: "Light"
          dark: "Dark"
          auto: "Auto"
        # `Admin::Ui::TranslateButtonComponent`: the button under a translated
        # field's input, and the outdated reference card's variant.
        translate_button:
          label: "Translate"
          update_label: "Suggest update"
        # `Admin::Ui::TranslateAllComponent`: the header of a page, post or
        # settings editor in a non-default language. `label`, `progress` and
        # `ready` are also written by `admin--translation--translate`, which
        # reads them from `data-messages`; `progress` counts by its total.
        translate_all:
          label:
            one: "Suggest translations for %{count} empty field"
            other: "Suggest translations for %{count} empty fields"
          progress:
            one: "Suggesting %{index} of %{count} field"
            other: "Suggesting %{index} of %{count} fields"
          ready:
            one: "%{count} suggestion ready"
            other: "%{count} suggestions ready"
          ready_initial: "0 suggestions ready"
          suggesting: "Suggesting…"
          cancel: "Cancel"
          use_all: "Use all"
          discard_all: "Discard all"
          nothing_empty: "No empty fields to translate"
          failed: "Couldn't get a suggestion — reload the page and try again"
          gone: "This field is no longer on the page — reload and try again"
          not_applied: "This text can't be replaced here"
          no_answer: "No suggestion came back for this field — try again"
        # `Admin::Ui::ReferenceCardComponent`: the primary-language original
        # beside a translated field; the notes of an outdated card.
        reference_card:
          confirm: "Still correct — mark up to date"
          changed: "↻ Changed"
          formatting_note: "Formatting changed"
          too_long_note: "The text is too long to compare word by word."
          no_source_note: "%{language} changed since this was translated."
        # `Admin::Ui::TranslationPendingComponent`: the waiting box a field's
        # suggestion slot shows. `elapsed` is also written by
        # `admin--translation--translate` every second; `timeout` is written
        # into the box when the provider's time is up.
        translation_pending:
          running: "Suggesting a translation…"
          elapsed: "%{seconds}s"
          cancel: "Cancel"
          timeout: "No suggestion after %{seconds} seconds."
          try_again: "Try again"
        # `Admin::Ui::SuggestionComponent`: the box an AI suggestion streams
        # into under a translatable field. `field_label` names the editable
        # textarea; `current` is the existing translation shown in update mode.
        suggestion:
          label: "Suggested translation · edit before using"
          field_label: "Suggested translation"
          current: "Current: %{text}"
          dismiss: "Dismiss"
          use: "Use"
          discard: "Discard"
        # `Admin::Ui::AuditSentenceComponent`: the actor's own words, the rest
        # of a sentence being `Audit::Sentence`'s. The viewer is "You" and
        # their own token follows after a comma; another person's token
        # follows after a space.
        audit_sentence:
          you: "You"
          via_you: ", via %{label}"
          via_other: " via %{label}"
        # One line of the inbox. Each reason is a whole sentence in each of
        # its three shapes: with a name (`%{name}` arrives as markup, the
        # name in a heavier weight), for a person who has since been deleted,
        # and with nobody to name (a reopen records no one).
        note_inbox_row:
          # The chip on an unread row: new, and for you.
          new: "New"
          # The verb the row ends in, inside its one link.
          verb: "Open thread"
          untitled: "(untitled)"
          mention:
            somebody_html: "%{name} mentioned you"
            deleted: "A deleted user mentioned you"
            nobody: "You were mentioned"
          reply:
            somebody_html: "%{name} replied"
            deleted: "A deleted user replied"
            nobody: "Someone replied"
          resolved:
            somebody_html: "%{name} resolved a note"
            deleted: "A deleted user resolved a note"
            nobody: "A note was resolved"
          reopened:
            somebody_html: "%{name} reopened a note"
            deleted: "A deleted user reopened a note"
            nobody: "A note was reopened"
          where:
            page: "Page · %{title}"
            post: "Post · %{title}"
            media: "Image · %{title}"
            block: "%{place} · %{block}"
        # `Admin::Ui::NewRecordDialogComponent`: the New page and New post
        # dialogs' shells; each kind's title and Create, the rest shared. The
        # standalone no-JS pages (`admin/pages/new`, `admin/posts/new`) read
        # the same words.
        new_record_dialog:
          page:
            title: "New page"
            create: "Create page"
          post:
            title: "New post"
            create: "Create draft"
          loading: "Loading…"
          load_failed: "The form couldn’t be loaded."
          submit_failed: "Couldn’t save. Check your connection and try again."
          retry: "Try again"
          cancel: "Cancel"
        # `Admin::Ui::RichTextDialogsComponent`: the rich-text editor's image,
        # YouTube and Page link dialogs. `edit_image`, `save`, `alt_fallback`,
        # `not_youtube`, `video_id` and `untitled_target` are written by `admin--rich-text--dialog`
        # (with `insert_image`, the image dialog's title when it inserts), and
        # reach it from <body>'s messages (`Admin::MessagesHelper::SCRIPT_MESSAGES`).
        rich_text_dialogs:
          image_title: "Image"
          edit_image: "Edit image"
          insert_image: "Insert image"
          save: "Save"
          remove_image: "Remove image"
          cancel: "Cancel"
          alt_text: "Alt text"
          caption: "Caption"
          media_fallback: "Empty uses the text from Media"
          alt_fallback: "Describe the image"
          youtube_title: "YouTube video"
          insert_video: "Insert video"
          youtube_label: "YouTube URL or video ID"
          youtube_placeholder: "https://www.youtube.com/watch?v=…"
          not_youtube: "That doesn’t look like a YouTube link."
          video_id: "Video id: %{id}"
          page_title: "Page link"
          remove_link: "Remove link"
          page_search: "Search pages and posts"
          page_placeholder: "Title…"
          page_list: "Pages and posts"
          untitled_target: "(untitled %{type} #%{id})"
        # `Admin::Ui::MailTestOutcomeComponent`: the answer to a test mail, on
        # Settings' Mail card and in the wizard's Mail step.
        mail_test_outcome:
          sent: "Test mail sent to %{address}. Check your inbox."
        # `Admin::Ui::MailHostValueComponent`: a mail field the host sets, the
        # security in its words.
        mail_host_value:
          set_by_host: "Set by the host"
          starttls: "STARTTLS"
          tls: "TLS"
          none: "None"
        # `Admin::Ui::MailFieldsComponent`: the Mail form's fields, on Settings
        # and in the wizard's Mail step: a label per `MailSettings` field.
        mail_fields:
          server_group: "Server"
          sender_group: "Sender"
          server: "Server"
          server_placeholder: "smtp.example.com"
          port: "Port"
          security: "Security"
          starttls: "STARTTLS"
          tls: "TLS"
          sender_name: "Sender name"
          sender_address: "Sender address"
          sender_address_placeholder: "no-reply@yourdomain"
