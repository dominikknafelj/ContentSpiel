# What the passkey services answer when they refuse (docs/reference/i18n.md):
# `add` is `SignIn::Passkeys::Add`'s, for a registration the check refused or a
# credential already stored, and `remove` is `SignIn::Passkeys::Remove`'s, for the
# last passkey of a person the policy covers. `recovery_codes.generate` is
# `SignIn::RecoveryCodes::Generate`'s, for a person who holds no passkey. The screens
# draw their own words from their component keys
# (`admin.components.account_screen.*`).
en:
  admin:
    passkeys:
      add:
        failed: "The passkey wasn't added. Try again."
      remove:
        last_required: "This site asks you to sign in with a passkey. Add another before removing this one."
    recovery_codes:
      generate:
        passkey_first: "Add a passkey first. Recovery codes are a backup for it."
