# The Groups screen's components (docs/reference/i18n.md):
# `admin.components.groups_screen.*`.
#
# The matrix's script redraws a row's chips and a branch's note after every
# change, from the same keys (`permission_row.chips`,
# `scope_editor.notes`), which the matrix hands it as `data-messages`.
#
# The delete zone's words are one whole sentence per shape, so a language
# can order the counts its own way. `delete_zone.effect` and
# `delete_zone.dialog_body.members_and_tokens` name both counts: each is
# keyed first by the members' plural category, which the I18n backend picks
# (`Admin::GroupsScreen::DeleteZoneComponent#members_category`), then by the
# tokens', which `t` pluralises. A language writes the categories its own
# rule has (`few`, `many`); under the CLDR rules a missing one falls back to
# `other`.
en:
  admin:
    components:
      groups_screen:
        list:
          group: "Group"
          members_column: "Members"
          tokens_column: "Tokens"
          actions: "Actions"
          built_in: "Built-in"
          members:
            one: "member"
            other: "members"
          tokens:
            one: "token"
            other: "tokens"
          edit: "Edit"
          footnote: "Built-in groups can be changed but not deleted. Deleting a custom group removes its permissions from its members and revokes its AI tokens."
        members:
          label: "Members"
          placeholder: "Add a user…"
          help: "Owners aren't listed: they already have every permission."
          owner: "Owner"
        permission_matrix:
          content: "Content permissions"
          content_intro: "Each permission has its own scope. No scope means everything."
          other: "Other permissions"
          locked_hint: "A greyed tick is a permission you can't hand out yourself. It stays as it is; ask an owner to change it."
          removed_value: "%{value}: removed when you save."
          dead: "This permission was limited to %{what}, so it matched nothing. It stays off unless you tick it again."
          dead_nothing: "nothing"
          dormant: "Limited to a content type that no longer exists (%{names}). Saving removes it; until then only someone who could grant that type can manage this group."
          unregistered: "The permission “%{key}” no longer exists and will be removed when you save."
        permission_row:
          short:
            read: "Read"
            create: "Create"
            edit: "Edit"
            publish: "Publish"
            move: "Move"
            delete: "Move to trash"
          accessible_label: "%{short}: %{label}"
          locked: "You can't grant this"
          edit_scope: "Edit scope"
          done: "Done"
          view_scope: "View scope"
          hide_scope: "Hide scope"
          chips:
            all_pages: "All pages"
            all_types: "All content types"
            own_only: "Own only"
            more: "+%{count}"
            removed_type: "! %{name} · type removed"
            under: "Under %{title}"
            unreadable: "A page you can't open"
        scope_editor:
          types: "Content types · none ticked = all"
          removed_type: "%{name} · this type no longer exists"
          remove: "Remove"
          own_only: "Own only"
          own_hint: "· Only posts the user wrote."
          branches: "Page branches · ticking a page includes everything under it · none = all"
          kept: "A page you can't open (kept)"
          unreadable_branches: "Some of these branches are pages you can't open. Only someone who can open them can change this permission."
          cant_open: "You can't open this page"
          notes:
            included: "included"
            partial: "contains a chosen page"
            includes:
              one: "includes %{count} subpage"
              other: "includes %{count} subpages"
        toggle_list:
          oversight: "Oversight"
          locked: "You can't grant this"
        delete_zone:
          heading: "Delete this group"
          # What deleting costs: the members' category, then the tokens'.
          effect:
            zero:
              zero: "It has no members. It has no AI tokens."
              one: "It has no members. 1 AI token is revoked."
              other: "It has no members. %{count} AI tokens are revoked."
            one:
              zero: "1 member loses its permissions. It has no AI tokens."
              one: "1 member loses its permissions. 1 AI token is revoked."
              other: "1 member loses its permissions. %{count} AI tokens are revoked."
            other:
