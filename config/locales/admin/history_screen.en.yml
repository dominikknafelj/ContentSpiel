# CS Studio's History screen components, `app/components/admin/history_screen/`
# (docs/reference/i18n.md; the words are the StudioHistory card's). Keys are
# `admin.components.history_screen.<class name without Admin:: and Component,
# underscored>`. The view has no words of its own: an `admin.history` scope
# would make every `history.…` literal in a script read as a message key
# (`test/lib/script_messages_test.rb`).
# YAML: a value with a leading or trailing space, a `%{...}`, a `:` or a
# glyph that opens a YAML token (a bullet, `·`) is double-quoted.
en:
  admin:
    components:
      history_screen:
        # `Admin::HistoryScreen::HeadComponent`, the crumbs and the heading row.
        head:
          title: "History"
          breadcrumb: "Breadcrumb"
          pages: "Pages"
          posts: "Posts"
          back: "Back to editor"
        # `Admin::HistoryScreen::VersionRowComponent`, one row of the versions.
        version_row:
          version: "Version %{number}"
          working: "Working version"
          saved: "Saved %{time}"
          # The time of a save made today: "14:02 today".
          today: "%{time} today"
          went_live: "Went live %{time}"
          goes_live: "Goes live %{time}"
          # A copy that was a scheduled change: "Went live 8 Nov 2026, 16:40 · was scheduled".
          with_scheduled: "%{line} · was scheduled"
          # Only a copy the migration made of what was live when history began.
          kept_when_began: "Kept when history began"
          # A copy with nobody behind it: the console, a seed, `bin/load`.
          by_system: "Published by the system"
          # A copy whose publisher's account was deleted since.
          by_removed: "Published by a removed account"
        # `Admin::HistoryScreen::VersionsComponent`, the rail, and below its
        # threshold the disclosure whose summary names the chosen version.
        versions:
          heading: "Versions"
          version: "Version %{number}"
          went_live: "Went live %{time}"
          goes_live: "Goes live %{time}"
          count:
            one: "1 version"
            other: "%{count} versions"
          # "Went live 3 Nov 2026 · 7 versions".
          summary_line: "%{time} · %{count}"
        # `Admin::HistoryScreen::ComparisonComponent`, one version compared
        # with another or with the working version, in one language.
        comparison:
          version: "Version %{number}"
          compared_with: "compared with"
          before_it: "the version before it (%{number})"
          working_option: "the working version"
          language: "Language"
          differs: "%{language} · differs"
          # The other languages under the select: "Deutsch differs too; Español is the same."
          others_differ:
            one: "%{languages} differs"
            other: "%{languages} differ"
          others_differ_too:
            one: "%{languages} differs too"
            other: "%{languages} differ too"
          others_same:
            one: "%{languages} is the same"
            other: "%{languages} are the same"
          separator: "; "
          line: "%{parts}."
          restore: "Restore version %{number}…"
          empty_title: "No versions yet"
          empty_body:
            page: "A version is kept each time this page is published."
            post: "A version is kept each time this post is published."
        # `Admin::HistoryScreen::RestoreDialogComponent`, "Restore version 5?".
        restore_dialog:
          title: "Restore version %{number}?"
          # "The working version of “Pricing” becomes version 5 as it went live on 3 Nov 2026. Nothing is published: …"
          # No possessive on the title: it breaks for "Prices" and in other languages.
          sentence: "%{becomes} %{site}"
          becomes:
            went: "The working version of “%{title}” becomes version %{number} as it went live on %{date}."
            goes: "The working version of “%{title}” becomes version %{number} as it goes live on %{date}."
          site:
            shown: "Nothing is published: the site keeps showing version %{number} until you publish the changes."
            none: "Nothing is published."
          untitled: "Untitled"
          back:
            one: "%{count} block that comes back returns without notes: a block's notes close when it is removed."
            other: "%{count} blocks that come back return without notes: a block's notes close when it is removed."
          # One block that goes, carrying `count` open notes.
          going_one:
            one: "1 block that goes carries 1 note; it closes with it."
            other: "1 block that goes carries %{count} notes; they close with it."
          # Several blocks that go, carrying `count` open notes between them.
          going_many:
            one: "%{blocks} blocks that go carry %{count} note; it closes with them."
            other: "%{blocks} blocks that go carry %{count} notes; they close with them."
          images:
            one: "1 image is no longer in the library: its block comes back empty."
            other: "%{count} images are no longer in the library: their blocks come back empty."
          tags:
            one: "1 tag no longer exists and is left off."
            other: "%{count} tags no longer exist and are left off."
          schedule: "The change scheduled for %{time} stays scheduled."
          nothing: "Version %{number} is the same as the working version. There is nothing to restore."
          cancel: "Cancel"
          close: "Close"
          confirm: "Restore version %{number}"
        # The toast after a restore (`Admin::PublishingController#restore`),
        # with what could not come back after it.
        restored: "Version %{number} restored as unpublished changes. Publish changes… puts it on the site."
        restored_draft: "Version %{number} restored."
        left_behind: "%{sentence}."
