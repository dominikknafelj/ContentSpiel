# System status (docs/reference/i18n.md): `admin/system_status/show.html.erb`,
# read by lazy lookup. The rows' words are `Admin::Ui::SystemCheckRowComponent`'s
# (`ui.en.yml`), and the checks' own sentences stay `Setup::SystemCheck`'s English,
# but for the Forms row's (`forms.en.yml`), the CS Studio address row's and the Visitor address row's, below.
en:
  admin:
    system_status:
      show:
        title: "System status"
        # The line under the heading, plural by the total (`count`): `time`
        # is the site's time in the `admin.time` format, so a translation
        # orders the three as its language does.
        summary:
          one: "%{passed} of %{count} check passed · last run %{time}"
          other: "%{passed} of %{count} checks passed · last run %{time}"
        run_again: "Run checks again"
        # The "Content" card under the checks (`Admin::SystemStatusController
        # #content_results`): what the content asks of someone, not checks.
        content:
          title: "Content"
          diagrams:
            label: "Diagrams"
            to_draw:
              one: "%{count} diagram to draw. Until it is drawn, the site shows its last drawing, or nothing."
              other: "%{count} diagrams to draw. Until one is drawn, the site shows its last drawing, or nothing."
            ok: "Every diagram is drawn."
      # The "CS Studio address" row (`Setup::SystemCheck#admin_address`), present
      # only when ADMIN_HOST is set.
      admin_address:
        label: "CS Studio address"
        message: "CS Studio answers at %{origin} alone. The public address answers no CS Studio page."
      # The "Single sign-on" row (`Setup::SystemCheck#single_sign_on`): `ok`
      # (with `required` after it while SSO_REQUIRED is set), `unreachable`
      # with a phrase for the provider's reason word (`reasons`), and `off` (quoted: a bare off is YAML's false).
      sso:
        label: "Single sign-on"
        ok: "%{provider} (%{issuer}) answers."
        required: "Required for everyone but owners."
        unreachable: "%{provider} (%{issuer}) didn't answer: %{reason}. Nobody can sign in with it until it does."
        "off": "Not set up. The hosting reference lists its variables."
        reasons:
          unreachable: "it could not be reached"
          http: "it answered with HTTP status %{status}"
          not_json: "its answer was not a discovery document"
          issuer_mismatch: "its document names another issuer"
          missing_endpoint: "its document lacks an endpoint sign-in needs"
      # The "Search" row (`Setup::SystemCheck#search`, `SiteSearch::Status`): `building`
      # and `stopped` with the build's progress, `not_built` and `out_of_date` (both with the command), `ready_builtin` (plural by the
      # pages and posts found, `number` the same with its delimiters) or `ready`
      # for an outside backend, `timeout`, `problem_detail` (a backend's own warning, its
      # `Health` sentence, cut to one line) or `problem` when it gave none, and `ready_detail` for an OK one that gave one and `limited`, the note
      # under the row for the languages the built-in searches by the text a page contains.
      search:
        label: "Search"
        building: "Building the search index: %{done} of %{total} records."
        stopped: "The search index stopped building at %{done} of %{total} records. Run this to finish it:"
        not_built: "The search index isn't built yet, so search finds nothing. Run this to build it:"
        out_of_date: "The search index is out of date: the site's languages or ContentSpiel's search rules changed since it was built. Run this to rebuild it:"
        ready_builtin:
          one: "Search finds 1 page or post (built-in)."
          other: "Search finds %{number} pages and posts (built-in)."
        ready: "%{backend} answers."
        ready_detail: "%{backend} answers: %{detail}"
        timeout: "%{backend} did not answer in 3 seconds. Visitors see “Search isn't available right now.”"
        problem: "%{backend} reports a problem but says no more. Check the engine itself."
        problem_detail: "%{backend} reports a problem: %{detail}"
        limited: "Search in %{languages} finds the text a page contains, with no stemming and no correction."
        tags_only: "Suggestions while typing offer tags only: %{label} offers no title suggestions."
      # The "Visitor address" row (`Setup::SystemCheck#visitor_address`):
      # OK with no Cloudflare header, OK when the header is the address the
      # request is counted by, and the warning when it is not.
      visitor_address:
        label: "Visitor address"
        no_header: "Each visitor counts by the address their request comes from."
        read: "Requests come through Cloudflare, and the visitor's own address is read."
        cloudflare_not_trusted: "Requests come through Cloudflare, but the visitor's own address is not read: every visitor counts as Cloudflare's. Set TRUSTED_PROXIES to Cloudflare's ranges."
