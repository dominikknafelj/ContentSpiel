# A form's write in CS Studio's words (forms plan, Task 2): the sentences
# `Forms::Save` refuses a save with, and those a destination's settings are
# refused with (`Forms::Destination`, `Forms::Destinations::Mail`). The
# Forms screen's own words are `admin.components.forms_screen` (Task 4).
en:
  admin:
    forms:
      save:
        name_blank: "A form needs a name."
        name_too_long: "A form's name is at most %{count} characters."
        too_many_fields: "A form has at most %{count} fields."
        field_at: "Field %{position}"
        label_missing: "Field %{position} needs a label in %{language}."
        unknown_field_type: "“%{type}” is not a kind of field this site knows."
        choices_missing: "“%{field}” needs at least one choice."
        too_many_choices: "“%{field}” has at most %{count} choices."
        choice_label_missing: "Every choice of “%{field}” needs a label in %{language}."
        unknown_destination: "“%{kind}” is not a destination this site knows."
        nowhere: "A form needs somewhere to send its submissions: keep them, or add a mail."
        no_encryption_keys: "This site has no encryption keys, so submissions can't be kept. See Hosting: encryption keys."
        no_encryption_keys_for_secret: "This site has no encryption keys, so a destination's password or key can't be stored. See Hosting: encryption keys."
        keep_days: "Submissions are kept for %{min} to %{max} days."
        unknown_languages: "Not saved: %{codes} is not a language this site can have."
        trashed: "This form is in the trash. Restore it to change it."
      destinations:
        blank: "%{field} can't be blank."
        mail:
          not_an_address: "“%{address}” is not one mail address."
          too_many: "A form mails at most %{count} addresses."
