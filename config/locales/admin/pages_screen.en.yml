# The strings of `app/components/admin/pages_screen/`: the page tree's head,
# its drag help, its empty line and the words its script announces a keyboard
# move in (`tree`), and a row of it (`tree_row`). The translation markers'
# words name the languages, so a screen reader hears what the tooltip shows a
# mouse.
en:
  admin:
    components:
      pages_screen:
        tree:
          heading: "Pages"
          new_page: "+ New page"
          more_actions: "More page actions"
          starter_pages: "Create starter pages"
          drag_help: "Press Space to pick up, arrow keys to move, Space to drop, Escape to cancel."
          empty: "No pages yet."
          # Announced by `admin--pages--tree` (from the frame's
          # `data-messages`) as a row is moved with the keyboard; `position`
          # is the sentence the other three end in.
          moves:
            picked_up: "Picked up %{title}. %{position}"
            dropped: "Dropped %{title}. %{position}"
            position: "Position %{position} of %{count}."
            cancelled: "Cancelled. %{title} is back where it was."
          # The head's button that folds the column to a strip (its name, and
          # the shared tooltip's text); "Show page tree" is its mirror.
          hide: "Hide page tree"
        tree_row:
          untitled: "(untitled)"
          context_only: "You can’t open this page"
          move: "Move %{title}"
          add_child: "Add a page under %{title}"
          subpages:
            one: "%{count} subpage"
            other: "%{count} subpages"
          translations:
            separator: " · "
            outdated:
              label:
                one: "%{count} outdated translation: %{languages}"
                other: "%{count} outdated translations: %{languages}"
              tooltip: "%{language}: %{count} outdated"
            missing:
              label:
                one: "%{count} missing translation: %{languages}"
                other: "%{count} missing translations: %{languages}"
              tooltip: "%{language}: %{count} missing"
