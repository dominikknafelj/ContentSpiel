# The Media screen's own keys (docs/reference/i18n.md): `admin.media.index` is
# the view's lazy-lookup scope (`app/views/admin/media/index.html.erb`). Its
# toolbar, grid and tiles say theirs as `admin.components.media_library`.
en:
  admin:
    media:
      index:
        title: "Media"
        upload: "Upload images"
        hint: "PNG, JPEG, GIF or WebP, up to %{mb} MB"
        drop: "Drop images to upload"
        # The rail of the chosen image: its tablist's name, its own tab, and its
        # Close's name and tooltip.
        rail_label: "Image details"
        image_tab: "Image"
        close: "Close panel"
      # The not-found page's link back to the library, when a chosen image is
      # gone (`Admin::MediaController#selected_asset`).
      not_found_back: "Back to Media"
