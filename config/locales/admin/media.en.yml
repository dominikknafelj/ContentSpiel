# The Media screen's own keys (docs/reference/i18n.md): `admin.media.index` is
# the view's lazy-lookup scope (`app/views/admin/media/index.html.erb`). Its
# toolbar, grid and tiles say theirs as `admin.components.media_library`.
en:
  admin:
    media:
      index:
        title: "Media"
        upload: "Upload images"
        hint: "PNG, JPEG, GIF or WebP, up to %{mb} MB"
        drop: "Drop images to upload"
        # The rail of the chosen image: its tablist's name, its own tab, and its
        # Close's name and tooltip.
        rail_label: "Image details"
        image_tab: "Image"
        close: "Close panel"
      # The picker's place, named for its script (`picker.html.erb`'s marker).
      picker:
        place_all: "All media"
        place_none: "Not in a folder"
      # The not-found page's link back to the library, when a chosen image is
      # gone (`Admin::MediaController#selected_asset`).
      not_found_back: "Back to Media"
      # What the folder and move endpoints answer with (`Admin::Answers::FolderDeleted`,
      # `ImagesMoved`): toasts, drawn by responders, so their keys are not a
      # view's lazy-lookup scope.
      answers:
        folder_deleted: "Folder deleted"
        no_folder: "Not in a folder"
        moved:
          one: "Moved “%{title}” to “%{folder}”."
          other: "Moved %{count} images to “%{folder}”."
        # A folder moved (`Admin::Answers::FolderSaved`), into a folder or to the top.
        folder_moved: "Moved “%{name}” to “%{parent}”."
        folder_moved_to_top: "Moved “%{name}” to the top of the library."
