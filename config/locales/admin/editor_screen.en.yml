# CS Studio's editor-screen components, `app/components/admin/editor_screen/` (docs/reference/i18n.md).
# Keys are `admin.components.editor_screen.<class name without Admin:: and Component, underscored>`.
# YAML: a value with a leading or trailing space, a `%{...}`, a `:` or a
# glyph that opens a YAML token (a bullet, `·`) is double-quoted.
en:
  admin:
    components:
      editor_screen:
        # A block's form drawn as the open panel of a section. The rest of the
        # block card is not converted yet. The panel's heading is
        # `editor_screen.panel_title`. `move_into` is the one item of a
        # top-level card's "⋯" menu that sections added.
        block_card:
          close: "Close"
          move_into: "Move into section…"
          take_over: "Take over"

        # The page's one "+ Add block" (a menu headed "Add a block", whose name
        # `menu_heading` is too) and the "+ Add" at the end of a section's lane,
        # named for its column.
        block_picker:
          add_block: "+ Add block"
          menu_heading: "Add a block"
          add: "+ Add"
          add_to_column: "Add a block to column %{number}"
        # A translation tab's read-only fields. Only the line above read-only
        # code is a key so far; `%{language}` is the default language's own
        # name, as a link to its tab.
        shared_fields:
          code_not_translated_html: "Code isn't translated. Edit it on the %{language} tab."
        # One line of a block's content on its tile in a section, and what
        # marks a tile that needs attention.
        tile_summary:
          unavailable: "Unavailable type — %{type}"
          no_image: "No image chosen"
          empty_text: "Empty text"
          needs_fixing: "Needs fixing"
          attention: "Needs attention"
          # A block type's own words on its tile, by type (a slash in its
          # name read as a dot): read by the tile for the parts its `summary`
          # answers (block types spec, decision 8).
          types:
            # bin/rails generate block_type adds a type's scope below this line.
            # A Form block's tile: no form chosen, or the one it names is
            # in the trash or purged (`BlockTypes::Form.summary`).
            form:
              no_form: "No form chosen"
              gone: "The form is gone"
            card:
              empty: "Empty"
              image_link_without_alt: "Image link has no alt text"
            table:
              empty: "Empty table"
            note:
              empty: "Empty"
            code:
              empty: "Empty"
            post_list:
              any_type: "All posts"
              tag: "tag %{name}"
        # A tile's "⋯" menu: every move a drag makes,
        # by name. `actions` names the button, whose label is the glyph.
        block_tile:
          actions: "Block actions"
          move_up: "Move up"
          move_down: "Move down"
          move_to_column: "Move to column…"
          move_out: "Move out of section"
          duplicate: "Duplicate"
          delete: "Delete block…"
        # The one "Move block" dialog of the page editor. `column` and
        # `section_column` are the choices `admin--editor--blocks#askWhere` writes
        # into its select: a tile is offered the other columns of its own
        # section; a card every column of every section, the sections
        # numbered as they stand in the page's list, top to bottom.
        move_dialog:
          title: "Move block"
          destination: "Move to"
          cancel: "Cancel"
          move: "Move"
          column: "Column %{column}"
          section_column: "Section %{section} · column %{column}"
        # What `admin--editor--blocks` says in its live region after a move made
        # from a "⋯" menu: the focus lands on a button every block names the
        # same, so this is what tells a screen reader which block went where.
        # `block` is the block's type as its card or tile shows it; the
        # position is the block's place among the blocks of where it now is.
        # `back` follows a move that was refused or failed.
        block_moves:
          up: "%{block} moved up. Position %{position} of %{count}."
          down: "%{block} moved down. Position %{position} of %{count}."
          column: "%{block} moved to column %{column}. Position %{position} of %{count}."
          into: "%{block} moved to column %{column} of section %{section}. Position %{position} of %{count}."
          out: "%{block} moved out of the section. Position %{position} of %{count}."
          back: "%{block} is back where it was."
          # The handle's keyboard path (`editor/keyboard_moves.js`): Space
          # picks a card up and drops it, Escape puts it back. `position` is
          # said alone on every arrow, and as the `%{position}` of the two
          # sentences above it.
          picked_up: "Picked up %{block}. %{position}"
          dropped: "Dropped %{block}. %{position}"
          cancelled: "Cancelled. %{block} is back where it was."
          position: "Position %{position} of %{count}."
          # The `%{block}` of a block whose card or tile shows no name.
          untitled: "block"
        # The confirmation behind every "Delete block…", in a card and in a
        # tile.
        delete_block_dialog:
          title: "Delete this block?"
          body: "Blocks don’t go to the trash. This can’t be undone."
          # The body on a published or scheduled page, INSTEAD of the one
          # above: there the delete is an unpublished change
          # like any other, so "can't be undone" would be untrue of the block
          # and is true only of its notes.
          published_body: "Blocks don’t go to the trash. The block is removed from the site only when the changes are published; until then “Discard changes…” brings it back. Its notes are deleted now and do not come back."
          confirm: "Delete block"
        # The Table block's grid controls (table block spec, "CS Studio";
        # Claude Design's B5 and its 2026-10-27 follow-up), around the grid of
        # a Table's card. `warning` is advice, never a refusal (decision 7):
        # the script says it again as rows and columns change, from these
        # same keys, so `%{count}` is filled by the server and by the script.
        table_controls:
          options: "Table options"
          header_row: "Header row"
          header_column: "First column as header"
          warning:
            columns:
              one: "%{count} column. On a phone, visitors scroll sideways to read this table."
              other: "%{count} columns. On a phone, visitors scroll sideways to read this table."
            rows:
              one: "%{count} row. A long table is easier to read split into several."
              other: "%{count} rows. A long table is easier to read split into several."
          # The strips around the grid (the owner's option B of 2026-10-29):
          # a group of column letters and one of row numbers, each letter or
          # number the button of its menu, named by the script from `menu`
          # (`%{letter}` is A, B, … AA; `%{number}` counts from 1).
          strips:
            columns: "Columns"
            rows: "Rows"
          row:
            menu: "Row %{number} actions"
            insert_above: "Insert above"
            insert_below: "Insert below"
            move_up: "Move up"
            move_down: "Move down"
            delete: "Delete row"
          column:
            menu: "Column %{letter} actions"
            insert_left: "Insert left"
            insert_right: "Insert right"
            move_left: "Move left"
            move_right: "Move right"
            # The column's alignment, the current one checked. `label` is
            # what the item shows under "Align", `name` what it is called.
            align: "Align"
            aligns:
              left:
                label: "Left"
                name: "Align left"
              center:
                label: "Centre"
                name: "Align centre"
              right:
                label: "Right"
                name: "Align right"
            delete: "Delete column"
          # The dashed "+" at the end of the column letters and the one under
          # the row numbers, and the button under the grid that is always
          # there (for touch).
          add_column: "Add a column"
          add_row_here: "Add a row"
          add_row: "Add row"
        # Deleting a row or a column that has text asks first (B5).
        table_delete_dialogs:
          row:
            title: "Delete this row?"
            body: "Its cells have text in them, and the text is deleted with the row."
            confirm: "Delete row"
          column:
            title: "Delete this column?"
            body: "Its cells have text in them, and the text is deleted with the column."
            confirm: "Delete column"
        # The heading of a block's form under a section's lanes.
        panel_title:
          title: "%{type} · column %{column}"
        section_card:
          name: "Section"
          move: "Move section"
          # The header's two selects; the labels name
          # controls that show only their value.
          background: "Background"
          backgrounds:
            none: "No background"
            tinted: "Tinted"
            strong: "Strong"
          width: "Width"
          widths:
            content: "Content width"
            full: "Full width"
          # The theme's section style, drawn only when the theme declares one.
          style: "Style"
          # Shown beside the selects for a style other than the default (issue 146).
          style_note: "This style may set its own layout, background or width."
          # The section's anchor: what a link `#anchor` jumps to.
          anchor: "Anchor"
          anchor_help: "Lets a link jump here, as #anchor. Leave empty for none."
          # The section's "⋯" menu and the dialog its last item opens.
          actions: "Section actions"
          move_up: "Move up"
          move_down: "Move down"
          duplicate: "Duplicate"
          remove_keep: "Remove section, keep blocks"
          delete: "Delete section and its blocks…"
          take_over: "Take over"
          delete_title: "Delete this section?"
          delete_body: "Blocks don’t go to the trash. This can’t be undone."
          delete_confirm: "Delete section"
          # The button that closes the settings under the head.
          close_settings: "Close"
          # A section whose type is not registered:
          # the unavailable block card's own heading, over the blocks it
          # holds. Its two buttons are `remove_keep` and `delete` above, the
          # menu's own words, and the sentence names all three ways out
          # without promising that the blocks are safe from the second.
          unavailable: "Unavailable type — %{type}"
          unavailable_hint: "Its blocks are still here. Remove the section and keep them, move them out one by one, or delete it with them."
          # The toast of a block that was not moved between the list and a
          # column, or between sections, because its form holds an edit that
          # was not saved (`admin--editor--blocks#move`): the move would redraw the
          # form.
          unsaved_move: "Reload or fix this block before moving it."
          # Under the reason of a refused move whose answer did not redraw
          # the list, because a form on the screen holds text that is not
          # saved (`admin--editor--blocks#renderKeepingForms`).
          reload_later: "Something on this page changed elsewhere. Reload once your unsaved text is safe."
        # The layout menu in a section's header: `name` is the button's
        # accessible name, `label` the word on it beside the diagram, and
        # each layout's name is what a screen reader gets for its diagram.
        section_layout_menu:
          name: "Layout"
          label: "Layout"
          layouts:
            one: "One column"
            two: "Two columns"
            three: "Three columns"
            four: "Four columns"
            one_two: "One third, two thirds"
            two_one: "Two thirds, one third"
        # Under the delete dialog's sentence, for a section that holds blocks.
        section_delete_count:
          blocks:
            one: "This also deletes the %{count} block in it."
            other: "This also deletes the %{count} blocks in it."
        # "5 blocks" in a section's head.
        section_summary:
          blocks:
            one: "%{count} block"
            other: "%{count} blocks"
        section_lanes:
          column: "Column %{number}"
        # A section's settings said as words in its head, each a button that
        # opens them; `label` is a word's accessible name.
        section_settings_words:
          columns:
            one: "%{count} column"
            other: "%{count} columns"
          backgrounds:
            none: "No background"
            tinted: "Tinted background"
            strong: "Strong background"
          widths:
            content: "Content width"
            full: "Full width"
          anchor: "#%{anchor}"
          label: "Section settings: %{word}"
        # A section on a translation tab: a heading over
        # its blocks' cards. `unavailable` is the heading of one whose type
        # is not registered.
        section_group:
          heading: "Section"
          unavailable: "Unavailable type — %{type}"
        # The tile's avatar of whoever is changing the block (handoff 4): its
        # tooltip and its text for a screen reader.
        holder_avatar:
          held: "%{name} is editing this block"
          own_tab: "You're editing this in another tab"
        # The mark a card carries for a few seconds after a colleague's save
        # arrived (live-editing handoff 10).
        updated_mark:
          updated_by: "Updated by %{name}"
        # Said in the header's notice area when the open record is in the
        # trash, deleted or not the viewer's to open (`admin--editing--live#gone`).
        live_region:
          missing: "This page was moved to the trash or deleted, or you can no longer open it."
          missing_post: "This post was moved to the trash or deleted, or you can no longer open it."
          back: "Back to pages"
          back_post: "Back to posts"
        # What stands between a card's header and its form while someone else
        # holds the block, and the notices that take its place (live-editing
        # handoff 1, 13 to 20, 23). Every sentence the hold script shows later
        # is rendered here; `settings` is the page settings (handoff 23).
        hold_strip:
          take_over: "Take over"
          # The status beside "Take over" (`admin--editing--hold#takeOver`): asked and waiting,
          # someone else's request already stands, and a request that did not go through.
          take_over_waiting: "Asking to take over…"
          take_over_pending: "Someone else is already taking this over"
          take_over_failed: "Couldn't take over. Try again."
          # Somebody else claimed it while this tab was waiting.
          take_over_claimed: "Someone else is editing this now"
          own_tab: "You're editing this in another tab"
          copy: "Copy my text"
          copied: "Copied"
          copy_failed: "Couldn't copy. Select the text and copy it yourself."
          discard: "Discard"
          remove: "Remove"
          held:
            block: "%{name} is editing this block"
            post: "%{name} is editing this post"
            settings: "%{name} is editing the page settings"
          taken:
            block: "Taken over by %{name} · just now"
            post: "Taken over by %{name} · just now"
            settings: "Taken over by %{name} · just now"
          announce:
            block: "%{name} took over this block"
            post: "%{name} took over this post"
            settings: "%{name} took over the page settings"
          # The viewer's own other tab holds it: one sentence for all three things.
          lost_own_tab: "You're editing this in another tab. Your changes weren't saved."
          lost:
            block: "%{name} is editing this block. Your changes weren't saved."
            post: "%{name} is editing this post. Your changes weren't saved."
            settings: "%{name} is editing the page settings. Your changes weren't saved."
          lost_unknown:
            block: "Someone else changed this block. Your changes weren't saved."
            post: "Someone else changed this post. Your changes weren't saved."
            settings: "Someone else changed the page settings. Your changes weren't saved."
          # An instant action (Publish, Schedule, "Still correct") refused while
          # another tab holds the subject (`Admin::EditingClaims#held_elsewhere?`).
          refused:
            block: "%{name} is editing this block. Try again when they have finished."
            post: "%{name} is editing this post. Try again when they have finished."
            settings: "%{name} is editing the page settings. Try again when they have finished."
            own_tab: "You're editing this in another tab. Do it there, or close that tab first."
            unknown: "Someone else is editing this. Try again when they have finished."
          # Bulk publish leaves out the posts someone is editing and says how many
          # (`Admin::BulkResponses#flash_bulk_result`).
          bulk_skipped:
            one: "%{count} post being edited by someone was skipped."
            other: "%{count} posts being edited by someone were skipped."
          deleted:
            block: "%{name} deleted this block. Your changes weren't saved."
          deleted_unknown:
            block: "This block was deleted. Your changes weren't saved."
          # The viewer's own other tab deleted it.
          deleted_own_tab: "You deleted this block in another tab. Your changes weren't saved."
          # The status beside "Copy my text" when the read of the card to show after
          # "Discard" failed: the notice stays.
          discard_failed: "Couldn't load the block. Try again."
        # A live page or post the site has no address for: another record
        # holds it, so a visitor is told "not found" (drafts plan, task 6).
        no_address_chip:
          label: "No address"
          title: "Another page or post holds this address, so this one shows “not found” on the site."

        # The header's two publishing parts (`PublishingStateComponent`): the
        # button that makes a published or scheduled record's rows what the
        # public sees.
        publishing_state:
          # Both open a dialog, hence the ellipsis.
          publish_changes: "Publish changes…"
          discard_changes: "Discard changes…"
          # Beside the chips, while a change waits for its time.
          scheduled: "Changes scheduled for %{time}"
        # The dialogs those buttons, and the menu's "Cancel scheduled
        # change", open (`PublishChangesDialogComponent`).
        publish_changes_dialog:
          title: "Publish changes"
          loading: "Reading what will change…"
          failed: "Couldn’t read what will change. Close this and open it again."
          when: "When"
          kept: "At the scheduled time (%{time})"
          now: "Now"
          at: "At a time"
          time: "Date and time"
          cancel: "Cancel"
          confirm: "Publish changes"
          discard_title: "Discard the unpublished changes?"
          discard_body:
            page: "This page goes back to what is published. Blocks added since are deleted with their notes; blocks deleted since come back without theirs."
            post: "This post goes back to what is published."
            # A scheduled record is not on the site yet: it goes back to what was scheduled.
            scheduled_page: "This page goes back to what was scheduled. Blocks added since are deleted with their notes; blocks deleted since come back without theirs."
            scheduled_post: "This post goes back to what was scheduled."
          # One more line when a change waits for its time: it goes too.
          discard_scheduled: "The changes scheduled for %{time} are discarded as well."
          discard_confirm: "Discard changes"
          cancel_scheduled_title: "Cancel the scheduled change?"
          cancel_scheduled_body: "The changes scheduled for %{time} will not be published then. They stay in the editor as unpublished changes."
          # The cancel dialog, opened after someone else cancelled or published the change.
          cancel_scheduled_gone: "No change is scheduled any more."
          cancel_scheduled_keep: "Keep it scheduled"
          cancel_scheduled_confirm: "Cancel scheduled change"
        # A published or scheduled page's address, changed at once through its
        # own form (drafts spec D7): the settings panel's line and button, and
        # the dialog the button opens.
        page_settings_form:
          address: "Address"
          change_address: "Change address…"
          template: "Template"
          shared: "Shared by all languages."
        # The New post and New page dialogs' shells (`new_*_dialog`), their
        # forms (`new_*_form`), and the three sentences their shared script
        # rewrites as the person types (`new_record`, handed over as
        # `Admin::EditorScreen::NewRecordMessages::KEYS`). A form's own `url`
        # and `not_listed` are the server's first drawing of the same line,
        # so they read as `new_record`'s do.
        new_post_dialog:
          title: "New post"
          loading: "Loading…"
          load_failed: "The form couldn’t be loaded."
          submit_failed: "Couldn’t save. Check your connection and try again."
          retry: "Try again"
          cancel: "Cancel"
          create: "Create draft"
        new_post_form:
          title: "Title"
          type: "Type"
          url: "URL: %{path}"
          not_listed: "Not listed on any page yet"
          # With a Type select the select names the type; with one creatable
          # type there is no select, and the note names it.
          note: "Created as a draft in %{language}. Everything can be changed in the editor."
          note_typed: "Created as a %{type} draft in %{language}. Everything can be changed in the editor."
        new_page_dialog:
          title: "New page"
          loading: "Loading…"
          load_failed: "The form couldn’t be loaded."
          submit_failed: "Couldn’t save. Check your connection and try again."
          retry: "Try again"
          cancel: "Cancel"
          create: "Create page"
        new_page_form:
          title: "Title"
          inside: "Inside"
          template: "Template"
          untitled: "(untitled)"
          # The error a create answers when the chosen parent went meanwhile.
          gone: "Choose a page that still exists."
          url: "URL: %{path}"
          note: "Created as a draft at the end of %{title}. Drag it in the tree to move it."
          home_note: "Created as the home page."
        new_record:
          url: "URL: %{path}"
          not_listed: "Not listed on any page yet"
          page_note: "Created as a draft at the end of %{title}. Drag it in the tree to move it."
        slug_dialog:
          title: "Change this page’s address"
          label: "Last part of the address"
          body: "The page moves to the new address at once, and the old address redirects to it. This does not wait for “Publish changes…”."
          cancel: "Cancel"
          confirm: "Change address"
          changed: "Address changed"
        # The rest of the header's strings are in `notes.en.yml` or not
        # converted yet.
        header:
          # Under the title of a post that has no address although a page's
          # unpublished rows hold a list block for it.
          waiting_lister: "Not listed on the site yet: the page “%{title}” lists this post, and its changes are not published."
          waiting_lister_unnamed: "Not listed on the site yet: a page lists this post, and its changes are not published."
          # The ⋯ menu's item, while a change waits for its time.
          cancel_scheduled_change: "Cancel scheduled change…"
          # Under the address of a live record, and of a scheduled one: the
          # plan's wording, with the button's name as it reads.
          live_hint: "This %{type} is live. Changes are published with “Publish changes…”."
          scheduled_hint: "This %{type} is scheduled. What was scheduled goes live at its time; later changes are published with “Publish changes…”."
        # What the redirect says once the copy is taken.
        publishing:
          published: "Changes published"
          # "Publish now" on a scheduled record that has been edited since: it goes live as it was scheduled.
          published_as_scheduled: "Published as it was scheduled. The changes made since are not published yet: “Publish changes…” publishes them."
          # A copy that waits for its time.
          scheduled: "Changes scheduled for %{time}"
          # The press found the rows and the newest copy the same.
          nothing: "Nothing to publish"
          discarded: "Changes discarded"
          cancelled: "Scheduled change cancelled"
          # "At the scheduled time" was chosen, and nothing is scheduled any
          # more (cancelled in another tab, or its time has come).
          not_scheduled: "These changes are no longer scheduled. Nothing was published."
        # The overview in the publish dialog (`ChangesOverviewComponent`).
        changes_overview:
          none: "Nothing to publish. This is the same as what is published."
          # Nothing was changed since a change was scheduled: its time can still be changed below.
          none_scheduled: "Nothing new to publish. This is the same as the changes scheduled for %{time}."
          compared_with_scheduled: "Compared with the changes scheduled for %{time}."
          blocks: "Blocks"
          fields:
            page: "Page"
            post: "Post"
          languages: "Languages"
          kinds:
            changed: "Changed"
            added: "Added"
            removed: "Removed"
            moved: "Moved"
          # The record's own fields, by the names their forms give them.
          field_names:
            title: "Title"
            subtitle: "Subtitle"
            meta_title: "Meta title"
            meta_description: "Meta description"
            hero_alt: "Hero image alt text"
            hero_media_asset_id: "Hero image"
            settings: "Template"
            excerpt: "Excerpt"
            body: "Body"
            metadata: "Fields"
            translated_metadata: "Fields"
            tags: "Tags"
          untitled: "(untitled)"
          held:
            page: "%{name} is editing this page. Only what has been saved is published."
            post: "%{name} is editing this post. Only what has been saved is published."
          # Other live records that a publish leaves without an address:
          # information, nothing is refused for it.
          lost_addresses:
            heading: "Addresses"
            body:
              page: "When this page is published, these lose their address and show “not found” on the site:"
              post: "When this post is published, these lose their address and show “not found” on the site:"
            hidden:
              one: "1 more that you can’t open"
              other: "%{count} more that you can’t open"
          # Live records that a publish MOVES to another address (a post
          # whose list on this page goes and which another page lists too):
          # the second group under "Addresses". The old address stays as a
          # redirect of the record (`PublicSite::Paths.foresee` reads it from
          # the trial), except where another record takes it in the same
          # publish, which the line then says (`no_redirect`).
          moved_addresses:
            body:
              page: "When this page is published, these move to another address. Each old address then redirects to the new one:"
              post: "When this post is published, these move to another address. Each old address then redirects to the new one:"
            # The old address and the new one.
            change: "%{from} → %{to}"
            # The record whose dialog this is, among those that move.
            own:
              page: "This page"
              post: "This post"
            no_redirect: "(no redirect: another page or post takes the old address)"
            hidden:
              one: "1 more that you can’t open"
              other: "%{count} more that you can’t open"
          # The record's own address: the one thing a publish is refused for.
          own_address:
            page: "This page would lose its own address, %{path} (%{languages}): another page or post holds the address it would get. Publishing is refused until one of them is renamed."
            post: "This post would lose its own address, %{path} (%{languages}): another page or post holds the address it would get. Publishing is refused until one of them is renamed."
        # The help under the related-posts chips (O7): the public post page
        # shows no related posts yet, so the help says only where they show.
        related_posts:
          help: "Related posts are linked to this one in the Mind graph. The site does not show them yet."
        # The editors' rail where it docks: the page editor's two tabs
        # (`admin/pages/show`), the page's settings and the chosen section's,
        # and the post editor's one (`PostFormComponent`), its heading.
        rail:
          tabs:
            page: "Page"
            post: "Post"
            section: "Section"
        # The Section tab with no section chosen (`admin--editor--section-choice`):
        # what to press to choose one.
        section_choice:
