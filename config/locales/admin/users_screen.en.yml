# The Users screen (docs/reference/i18n.md): `admin.components.users_screen.*`
# are its components' keys (the list, the invite dialog, the owner and
# delete zones; the group cards still hold their words as literals);
# `admin.users.index` is the list page's lazy-lookup scope (only the invite
# strings so far); `admin.invites` what `Admin::InvitesController` answers.
