# The Users screen's components (docs/reference/i18n.md):
# `admin.components.users_screen.*` are the list's, the invite dialog's,
# the group tiles' and the owner and delete zones' keys; `admin.invites`
# what `Admin::InvitesController` answers. The
# Users views' own keys and the controller's flashes are `users.en.yml`.
