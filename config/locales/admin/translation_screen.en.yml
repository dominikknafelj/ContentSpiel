# CS Studio's translation-screen components, `app/components/admin/translation_screen/` (docs/reference/i18n.md).
# Keys are `admin.components.translation_screen.<class name without Admin:: and Component, underscored>`.
# YAML: a value with a leading or trailing space, a `%{...}`, a `:` or a
# glyph that opens a YAML token (a bullet, `·`) is double-quoted.
en:
  admin:
    components:
      # `Admin::TranslationScreen::MatrixComponent`: its columns, the kind's
      # word beside its chip, the settings row's title and a cell's link label.
      translation_screen:
        matrix:
          columns:
            item: "Item"
            type: "Type"
            action: "Action"
          types:
            page: "Page"
            post: "Post"
            media: "Image"
            settings: "Settings"
          settings_title: "Site settings · title, tagline"
          untitled: "(untitled)"
          empty: "Everything is translated."
          cell_label:
            complete: "%{title}: %{language}, translated"
            missing: "%{title}: %{language}, missing"
            outdated: "%{title}: %{language}, outdated"
          # The row's verb at its end, and the title link's name.
          action:
            review: "Review changes →"
            translate: "Translate →"
          open_label:
            review: "Review changes: %{title}"
            translate: "Translate: %{title}"
        # `Admin::TranslationScreen::StateCellComponent`, a cell's word.
        state_cell:
          complete: "Translated"
          missing: "Missing"
          outdated: "Outdated"
        # `Admin::TranslationScreen::SummaryCardComponent`, a language's tile.
        # The link's name says what pressing it does; the figures describe it
        # (the bar and the counts are `Admin::Ui::LanguageProgressComponent`'s).
        summary_card:
          link_label:
            language: "%{language}: show items to translate"
            all: "%{language}: show all languages"
          done: "%{percent}% done"
