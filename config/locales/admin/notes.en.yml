# Notes on content (docs/reference/i18n.md): everything a person reads about
# notes. `admin.notes.errors` are the sentences the `Notes::` services answer
# with; later tasks add `admin.notes.script` (what the scripts say),
# `admin.notes.index` and `admin.note_inbox` (the views' own lazy-lookup
# scopes) and `admin.components.notes_screen` (the components).
#
# Each shape of a sentence is a whole sentence of its own, one per kind of
# record, never glued from a noun: a translator can reorder it.
en:
  admin:
    notes:
      index:
        title: "Notes · CS Studio"
      # What a thread is on when it is on the record itself: its group's
      # heading in the list, and the heading of its thread view.
      subject:
        page: "Whole page"
        post: "Whole post"
        media: "This image"
        # A block in a section's column: "Section › Column 2 · Rich text".
        in_section: "%{section} › Column %{column} · %{type}"
        # A block with no text and no image, by its place on the page.
        block: "Block %{position}"
      errors:
        blank: "Write something first."
        too_long: "A note can be at most 4,000 characters."
        too_many_mentions: "A note can mention at most 20 people."
        # Names nobody, and is the same for a user who doesn't exist: a
        # mention can be typed by hand (`Notes::Authorization#mention_errors`).
        mention_cannot_read:
          page: "Someone you mentioned can't see this page."
          post: "Someone you mentioned can't see this post."
          image: "Someone you mentioned can't open the media library."
        gone:
          page: "This page is in the trash or was deleted."
          post: "This post is in the trash or was deleted."
          image: "This image is in the trash or was deleted."
          block: "This block was deleted."
          note: "This note is gone: it was deleted, or what it was on was."
        not_yours: "Only the person who wrote a note can change it."
        delete_others: "Only the person who wrote a note, or someone who can edit what it is on, can delete it."
        pin_resolved: "Reopen this note before pinning it."
      # What the notes' scripts say. `mentions` is `admin--note-composer`'s
      # (`messages_data` on the composer's form); the rest is `admin--notes`',
      # which lives on <body>, so they are <body>'s
      # (`Admin::MessagesHelper::SCRIPT_MESSAGES`): the header button's name,
      # a marker's name in each of its three states, and the sentence a
      # block's delete dialog adds, with a section's own.
      script:
        total:
          one: "Notes, %{count} open"
          other: "Notes, %{count} open"
        marker:
          add: "Add a note on %{name}"
          open:
            one: "%{count} open note on %{name}"
            other: "%{count} open notes on %{name}"
          selection: "Add a note on the selected text in %{name}"
        delete_warning:
          one: "This block has %{count} open note. It will be deleted with it."
          other: "This block has %{count} open notes. They will be deleted with it."
        # In the dialog of "Delete section and its blocks…": the open notes
        # on the blocks inside it (a section takes none of its own).
        delete_section_warning:
          one: "This section and its blocks have %{count} open note. It will be deleted too."
          other: "This section and its blocks have %{count} open notes. They will be deleted too."
        mentions:
          none: "Nobody by that name can see this."
          count:
            one: "%{count} person. Use the arrow keys and Enter."
            other: "%{count} people. Use the arrow keys and Enter."
    # The inbox (notes spec §5): the full list at `<admin>/notes`
    # (`index`, the view's own lazy-lookup scope) and the dashboard's two
    # cards. `card.new` stands beside the card's title, in the small
    # upper-case label style.
    note_inbox:
      index:
        page_title: "Notes for you · CS Studio"
        title: "Notes for you"
        mark_all_read: "Mark all read"
        empty: "No notes for you."
      card:
        title: "Notes for you"
        empty: "No notes for you."
        # The card's footer link; the arrow is decoration, hidden from a
        # screen reader.
        all_html: "All notes for you %{arrow}"
        mark_all_read: "Mark all read"
        new:
          one: "%{count} new"
          other: "%{count} new"
      open_threads:
        title: "Open threads"
        empty: "No open threads."
        # The name of the number beside the title, for a screen reader.
        total:
          one: "%{count} open thread in all"
          other: "%{count} open threads in all"
    # The mind graph's selection card (`mind_graph/card_notes.js`): a post's
    # open notes and the field that starts one. Served by the Mind graph's own
    # `messages_data` call, beside the card's other strings in
    # `mind_graph.en.yml`. The title is drawn in the small upper-case label
    # style.
    mind_graph:
      script:
        card:
          notes:
            title: "Open notes · %{count}"
            label: "Write a note on this post"
            add: "Add note"
            replies:
              one: "%{count} reply"
              other: "%{count} replies"
            more:
              one: "+%{count} more"
              other: "+%{count} more"
            deleted_user: "a deleted user"
            # Read out after a row that holds something the viewer has not
            # read; on screen the row says it with ink and the accent dot.
            unread: "new"
            failed: "The notes couldn't be loaded or saved. Try again."
    components:
      # The legend's swatch for a node's notes badge.
      mind_graph_legend:
        notes: "Open notes"
      # The editor header's Notes button. `components.en.yml` holds nothing of
      # the header's yet (it is not converted); these two merge into its scope.
      # "Add note", first in the "⋯" menu of a block's card and of its tile in
      # a section. Neither component's other strings live here
      # (`components.en.yml` has the tile's; the card is not converted): these
      # two merge into their scopes.
      block_card:
        add_note: "Add note"
      editor_screen:
        block_tile:
          add_note: "Add note"
        header:
          notes: "Notes"
          # The page tree's drawer, where the notes column has folded the
          # tree away and there is no top bar (the top bar's own button
          # reads the same).
          tree: "Pages ▾"
          tree_label: "Open page tree"
          # The button's accessible name; `admin.notes.script.total` is the
          # same sentence for the script that keeps it current.
          notes_label:
            one: "Notes, %{count} open"
            other: "Notes, %{count} open"
      # A record's open notes where it is listed (notes spec §4.4). None of
      # these three components' other strings live here (they are not
      # converted): these merge into their scopes.
      media_library:
        panel:
          notes: "Notes"
          # After "Notes": "· 2 open". `%{number}` is the element the script
          # rewrites as the count changes, so the sentence has one form.
          notes_open_html: "· %{number} open"
          notes_loading: "Loading notes…"
        tile:
          open_notes:
            one: "%{count} open note"
            other: "%{count} open notes"
      posts_screen:
        table:
          # The column's name, for a screen reader: its header shows an icon.
          notes: "Notes"
          open_notes_title: "Open notes"
          open_notes:
            one: "%{count} open note"
            other: "%{count} open notes"
      tree_node:
        open_notes:
          one: "%{count} open note"
          other: "%{count} open notes"
      notes_screen:
        drawer:
          title: "Notes"
          # Beside the title: "4 open". `%{number}` is the element the script
          # rewrites as the count changes, so the sentence has one form.
          open_html: "%{number} open"
          new: "New note"
          close: "Close"
          loading: "Loading notes…"
          back: "Back to %{title}"
          untitled: "(untitled)"
        list:
          pinned: "Pinned"
          open:
            one: "Open · %{count}"
            other: "Open · %{count}"
          none_open: "No open notes."
          more: "Show more"
          resolved:
            one: "Resolved (%{count})"
            other: "Resolved (%{count})"
          new: "New note"
          # The field for a new note (`#notes-new`).
          new_label: "Write a note"
          add: "Add note"
          new_on:
            page: "New note on this page"
            post: "New note on this post"
            media: "New note on this image"
          new_on_block: "New note on %{block}"
          quoted: "Quoted"
          empty_title: "No notes yet"
          empty:
            page: "Ask a question about this page or one of its blocks."
            post: "Ask a question about this post."
            media: "Ask a question about this image."
          notices:
            gone: "This note is gone: it was deleted, or what it was on was."
        thread_row:
          new: "new"
          replies:
            one: "%{count} reply"
            other: "%{count} replies"
        thread:
          # The arrow before it is an icon (`:arrow_left`), not part of the text.
          back: "All notes"
          # Row 1's Close, the drawer's own while a thread is open.
          close: "Close"
          # Under what the thread is on: "2 messages · started on DE".
          messages:
            one: "%{count} message"
            other: "%{count} messages"
          started_on: "started on %{language}"
          quoted: "Quoted"
          pinned: "Pinned"
          resolved_by: "Resolved by"
          written_on: "Written on %{language}"
          show_more:
            one: "Show %{count} more"
            other: "Show %{count} more"
          resolve: "Resolve"
          reopen: "Reopen"
          pin: "Pin"
          unpin: "Unpin"
          follow: "Notify me"
          unfollow: "Stop notifying me"
          reply: "Reply"
          send_reply: "Reply"
        message:
          edited: "edited"
          # The name of the "⋯" menu, for a screen reader.
          actions: "Note actions"
          edit: "Edit"
          edit_label: "Edit your note"
          save: "Save"
          cancel: "Cancel"
          delete: "Delete"
          delete_question: "Delete this note?"
          delete_confirm: "Delete"
        # A block's marker as the server draws it, before the script has the
        # counts: its name without notes, and what it reads while text is
        # selected in the block (`admin.notes.script.marker` are its names
        # in every state).
        marker:
          add: "Add a note on %{name}"
          selection: "Note on selection"
        composer:
          people: "People you can mention"
          emoji: "Emoji"
          mention: "Mention someone"
          send_hint: "Ctrl+Enter to send"
          # The field's placeholder, from its label: "Reply…", "Write a note…".
          placeholder: "%{label}…"
        # One line of the inbox. Each reason is a whole sentence in each of
        # its three shapes: with a name (`%{name}` arrives as markup, the
        # name in a heavier weight), for a person who has since been deleted,
        # and with nobody to name (a reopen records no one).
        inbox_row:
          unread: "Unread"
          untitled: "(untitled)"
          mention:
            somebody_html: "%{name} mentioned you"
            deleted: "A deleted user mentioned you"
            nobody: "You were mentioned"
          reply:
            somebody_html: "%{name} replied"
            deleted: "A deleted user replied"
            nobody: "Someone replied"
          resolved:
            somebody_html: "%{name} resolved a note"
            deleted: "A deleted user resolved a note"
            nobody: "A note was resolved"
          reopened:
            somebody_html: "%{name} reopened a note"
            deleted: "A deleted user reopened a note"
            nobody: "A note was reopened"
          where:
            page: "Page · %{title}"
            post: "Post · %{title}"
            media: "Image · %{title}"
            block: "%{place} · %{block}"
        open_thread_row:
          untitled: "(untitled)"
          kind:
            page: "Page"
            media: "Image"
          open:
            one: "%{count} open note"
            other: "%{count} open notes"
