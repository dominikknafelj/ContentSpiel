# The dashboard's own keys (docs/reference/i18n.md): `admin.dashboard.show` is
# the view's lazy-lookup scope (`app/views/admin/dashboard/show.html.erb`). The
# whole view is converted. An empty card's words are Claude Design's (O6).
en:
  admin:
    dashboard:
      show:
        title: "Dashboard"
        # Your drafts: "Start a draft" moves the focus to the quick-create title.
        drafts:
          title: "Your drafts"
          empty: "No drafts."
          start: "Start a draft"
          all: "All drafts"
        # Going live next: "Drafts →" opens the posts list's drafts.
        going_live:
          title: "Going live next"
          empty: "Nothing scheduled."
          drafts_html: "Drafts %{arrow}"
          all: "All scheduled posts"
        # The card of published and scheduled pages and posts whose rows have
        # moved on from what the site shows (drafts spec §3).
        unpublished_changes:
          title: "Unpublished changes"
          empty: "No unpublished changes."
        activity:
          title: "Recent activity"
          empty: "No recent activity."
          audit_log_html: "Full audit log %{arrow}"
