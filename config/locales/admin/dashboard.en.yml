# The dashboard's own keys (docs/reference/i18n.md): `admin.dashboard.show` is
# the view's lazy-lookup scope (`app/views/admin/dashboard/show.html.erb`). The
# whole view is converted. Each panel has a heading that says its job and one
# line under it (`Admin::DashboardScreen::PanelComponent`'s `title:` and
# `line:`), and an empty panel says its one `empty` line.
en:
  admin:
    dashboard:
      show:
        title: "Dashboard"
        # The viewer's drafts: "Start a draft" moves the focus to the quick-create title.
        drafts:
          title: "Pick up where you left off"
          line: "Your drafts, the latest first."
          empty: "No drafts."
          start: "Start a draft"
          all: "All drafts"
        # What is scheduled: "Drafts →" opens the posts list's drafts.
        going_live:
          title: "Publishing on its own"
          line: "Scheduled pages and posts, the soonest first."
          empty: "Nothing scheduled."
          drafts_html: "Drafts %{arrow}"
          all: "All scheduled posts"
        # Published and scheduled pages and posts whose rows have moved on
        # from what the site shows.
        activity:
          title: "What changed recently"
          line: "The latest changes to pages, posts and images."
          empty: "No recent activity."
          audit_log_html: "Full audit log %{arrow}"
