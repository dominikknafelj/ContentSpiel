# The public site's own strings: what the default theme's templates say to a
# visitor that no editor typed. Read in the visitor's language, with English
# as the fallback (`PublicStrings.read`, `app/values/public_strings.rb`), so a language without a
# `public.<locale>.yml` shows English and never "translation missing".
#
# This file starts ahead of the roadmap's item on translating the public site
# (item 7 of "Next"): the Code block's four strings are the first keys, with
# the default templates' own words under `public.site` (`site_string`); the
# site's other strings are still literals in the templates, and that item
# moves them here and adds German and Spanish.
en:
  public:
    # The default templates' own words (`pages/show`, `posts/detail_component`),
    # read by `ThemeHelper#site_string` and by nothing else.
    site:
      in_this_section: "In this section"
      tagged: "Tagged"
    blocks:
      # bin/rails generate block_type adds a type's scope below this line.
      # The Table block's scroll box where the table has no caption to name it
      # (`app/components/blocks/table_component.html.erb`).
      table:
        label: "Table"
      # The Note block's heading where the editor typed no title: the
      # kind's word (`Blocks::NoteComponent`).
      note:
        kinds:
          note: "Note"
          tip: "Tip"
          important: "Important"
          warning: "Warning"
      # The Code block's copy button: its label, its accessible name, and
      # what it says for two seconds after a press (or when the browser
      # refuses the clipboard).
      code:
        copy: "Copy"
        copy_code: "Copy code"
        copied: "Copied"
        failed: "Not copied"
    # A form's own words (forms plan): what a visitor reads that no editor
    # typed, read through `PublicStrings.read` (`Forms::PublicField#word`,
    # `Forms::BuiltInFieldTypes`). `yes` and `no` are what a checkbox answer
    # reads as in a submission (in the site's default language).
    forms:
      required: "required"
      choose: "Choose"
      "yes": "Yes"
      "no": "No"
      errors:
        blank: "Please fill in this field."
        invalid: "Please check this entry."
        inclusion: "Please choose one of the options."
        too_long: "This is too long."
