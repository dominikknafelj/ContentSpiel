# The public site's own strings: what the default theme's templates say to a
# visitor that no editor typed. Read in the visitor's language, with English
# as the fallback (`PublicStrings.read`, `app/values/public_strings.rb`), so a language without a
# `public.<locale>.yml` shows English and never "translation missing".
#
# This file starts ahead of the roadmap's item on translating the public site
# (item 7 of "Next"): the Code block's four strings are the first keys, with
# the default templates' own words under `public.site` (`site_string`); the
# site's other strings are still literals in the templates, and that item
# moves them here and adds German and Spanish.
en:
  public:
    # The default templates' own words (`pages/show`, `posts/detail_component`),
    # read by `ThemeHelper#site_string` and by nothing else.
    site:
      in_this_section: "In this section"
      tagged: "Tagged"
    blocks:
      # bin/rails generate block_type adds a type's scope below this line.
      # The Table block's scroll box where the table has no caption to name it
      # (`app/components/blocks/table_component.html.erb`).
      table:
        label: "Table"
      # The Note block's heading where the editor typed no title: the
      # kind's word (`Blocks::NoteComponent`).
      note:
        kinds:
          note: "Note"
          tip: "Tip"
          important: "Important"
          warning: "Warning"
      # The Code block's copy button: its label, its accessible name, and
      # what it says for two seconds after a press (or when the browser
      # refuses the clipboard).
      code:
        copy: "Copy"
        copy_code: "Copy code"
        copied: "Copied"
        failed: "Not copied"
    # A form's own words (forms plan): what a visitor reads that no editor
    # typed, read through `PublicStrings.read` (`Forms::PublicField#word`,
    # `Forms::BuiltInFieldTypes`). `yes` and `no` are what a checkbox answer
    # reads as in a submission (in the site's default language).
    forms:
      required: "required"
      choose: "Choose"
      "yes": "Yes"
      "no": "No"
      errors:
        blank: "Please fill in this field."
        invalid: "Please check this entry."
        inclusion: "Please choose one of the options."
        too_long: "This is too long."
      # What the endpoint a form posts to answers (`FormSendsController`,
      # forms plan Task 6; design.md 4 and 5): the same words in the JSON
      # the script writes in place and on the plain pages without it.
      # `submit` is the button's word where the form has no submit label,
      # `sent` the thank-you where it has none of its own. `error_item` is
      # one link of the error summary, so a language orders the two parts.
      # `back` is the link to the page the form came from (the "← " is the
      # template's, not the key's).
      submit: "Send"
      sent: "Thank you. Your answers have been sent."
      error_summary:
        one: "Please correct 1 answer."
        other: "Please correct %{count} answers."
      error_item: "%{label}: %{message}"
      gone: "This form is no longer available."
      unavailable: "This form can't take answers at the moment. Please try again later."
      rate_limited: "Too many messages. Please try again in a few minutes."
      # What the Form block's script says when a send had no answer, or one
      # that was not the endpoint's (pre-flight R16): the typed answers stay,
      # and the browser is never made to send the form itself.
      network: "Your answers couldn't be sent. Please check your connection and try again."
      # The button's word while a send is on its way (the script's value).
      sending: "Sending…"
      back: "Back to the page"
      # The plain pages' headings (and titles), without JavaScript.
      pages:
        sent: "Sent"
        invalid: "Check your answers"
        gone: "Form not available"
        unavailable: "Form not available right now"
        rate_limited: "Too many messages"
