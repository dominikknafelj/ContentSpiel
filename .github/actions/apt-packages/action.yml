name: Install apt packages
description: Installs packages with their downloaded .debs kept in actions/cache.

# The one place the apt cache's key and steps are written, used by every job of
# ci.yml that installs packages and by apt-cache.yml, which fills the cache from
# the default branch (see there for why). The packages come from
# azure.archive.ubuntu.com, whose download speed varies: the libvips
# dependencies (about forty .debs) took 20 seconds on one run and four minutes
# on the next. So the downloaded .debs are kept with actions/cache, one entry
# per package set and runner image, in a folder of the runner user's own (apt is
# pointed at it, and `sudo` is not needed to save it); on a hit apt installs
# from them with no download at all. The lock file is root's and unreadable, so
# it is left out. Install first, update only if that fails: the image ships apt
# lists (the logs show `Hit:` on them), and a stale list that 404s falls back to
# `apt-get update`. The repository must be checked out before this runs (a
# local action is read from the checkout).
inputs:
  packages:
    description: Space-separated package names.
    required: true

runs:
  using: composite
  steps:
    - name: Name the apt cache
      id: apt
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        echo "key=apt-$(. /etc/os-release; echo $VERSION_ID)-${ImageVersion:-none}-${PACKAGES// /-}" >> "$GITHUB_OUTPUT"
        mkdir -p "$RUNNER_TEMP/apt-archives/partial"
        chmod -R a+rwX "$RUNNER_TEMP/apt-archives"

    - name: Restore the downloaded packages
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/apt-archives
          !${{ runner.temp }}/apt-archives/lock
        key: ${{ steps.apt.outputs.key }}

    - name: Install packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        APT: -o Dir::Cache::archives=${{ runner.temp }}/apt-archives -o APT::Keep-Downloaded-Packages=true
      run: sudo apt-get $APT install --no-install-recommends -y $PACKAGES || { sudo apt-get update && sudo apt-get $APT install --no-install-recommends -y $PACKAGES; }
