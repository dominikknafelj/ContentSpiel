name: CI

# A pull request's run is the only automatic one: a merge to main is the code
# that run already tested, and running it again there cost about half of the
# account's Actions minutes (a full run is about 48 billed minutes: a private
# repository pays per job, rounded up). `workflow_dispatch` runs everything on
# any branch, main included, by hand ("Run workflow", or `gh workflow run CI`).
#
# The browser suite is the bulk of a run's minutes (a pull request's run was
# about 77 billed minutes, most of it the suite), so since 2026-10-26 it runs
# only in a run started by hand, and is run locally before every push, until
# the repository is public and Actions minutes are free; then the `if` of
# `system-test-shard` below goes.
on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request ends the run of the push before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      # `bin/importmap audit` boots the full Rails app, which requires
      # ActiveStorage's vips variant processor at initialization -- same
      # native dependency the test jobs below install.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # Tests print everything in CI (migration statements, seed output);
          # a local run is quiet unless VERBOSE=1 is set (test/test_helper.rb).
          VERBOSE: "1"
          # SimpleCov (test/test_helper.rb): the report is kept as an artifact.
          COVERAGE: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

      # The stylesheet built with THEME_PATH set, and production started
      # under that theme (bin/theme-build-check). After the tests, because
      # it writes app/assets/builds. A step of this job and not a job of its
      # own: a job is billed by the started minute and would set up Ruby
      # again; here it is three boots of the application.
      - name: Build the stylesheet under a theme and start production under it
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/theme-build-check

      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage
          include-hidden-files: true
          if-no-files-found: ignore

  # What changed, so the browser suite can be skipped when nothing it tests did.
  # Only documents count as "nothing": the unit suite reads them (the guards in
  # test/lib scan CLAUDE.md and docs/reference), so it always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything but documents change?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A run with no base (one started by hand) runs everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The image workflow is no code a browser test runs: a change of
          # that file alone skips the suite as a change of the docs does.
          if git diff --name-only "$BASE" "$HEAD" | grep -qvE '^(docs/|[^/]+\.md$|\.github/workflows/image\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The browser suite, as four jobs side by side: a runner has two cores, and
  # the whole suite on two processes took 28 minutes. `bin/system-test-shard`
  # deals the files so each job holds about the same number of tests
  # (test/lib/system_test_shards_test.rb keeps every file in exactly one).
  # Only a run started by hand runs them (see the top of this file).
  system-test-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Cuprite (via Ferrum) drives the Chrome that GitHub's ubuntu runners
      # ship preinstalled; BROWSER_PATH pins it rather than relying on
      # Ferrum's PATH search. The files are named, so this is `bin/rails test`
      # (`test:system` would ignore them), and the stylesheet is built first,
      # which `test:system` did by itself. `-v` prints each test with its time:
      # test/system_test_seconds.yml is measured from this log, since a runner's
      # pace is not a laptop's.
      - name: Run System Tests
        env:
          RAILS_ENV: test
          VERBOSE: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          bin/rails db:test:prepare tailwindcss:build
          bin/rails test -v $(bin/system-test-shard ${{ matrix.shard }} 4)

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # One check that speaks for the four: green when every shard passed, when
  # the suite was skipped because only documents changed, and on a pull request,
  # where the shards are skipped by design (see the top of this file).
  system-test:
    needs: [changes, system-test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Did every shard pass?
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.system-test-shard.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CODE" = "false" ] && [ "$SHARDS" = "skipped" ]; then
            echo "Only documents changed: the browser suite was not run."
            exit 0
          fi
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$SHARDS" = "skipped" ]; then
            echo "The browser suite is not run on pull requests while the repository is private; it is run locally before every push. To run it on CI: gh workflow run CI --ref <branch> (or \"Run workflow\")."
            exit 0
          fi
          [ "$SHARDS" = "success" ] || { echo "system tests: $SHARDS"; exit 1; }
