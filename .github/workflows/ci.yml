name: CI

# CI runs for every pull request: lint, the scans, the unit tests (as two shards)
# and the browser suite (as four shards). A merge to main is the code a pull request
# already tested, so it is not run again; main is run by hand when that is
# wanted. `workflow_dispatch` runs everything on any branch, main included
# ("Run workflow", or `gh workflow run CI --ref main`).
on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request ends the run of the push before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      # `bin/importmap audit` boots the full Rails app, which requires
      # ActiveStorage's vips variant processor at initialization -- same
      # native dependency the test jobs below install.
      - name: Install packages
        # Install first, update only if that fails: the runner image ships apt lists
        # (the logs show `Hit:` on them), and `apt-get update` is the step whose time
        # varies from ten seconds to nearly five minutes on a slow mirror, while the
        # packages themselves are small. A stale list that 404s falls back to it.
        run: sudo apt-get install --no-install-recommends -y libvips || { sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips; }

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # The unit suite, as two jobs side by side: a runner has two cores, and the
  # whole suite on them took nine minutes, about as long as a browser shard.
  # `bin/test-shard unit` deals the files by their measured seconds
  # (test/unit_test_seconds.yml), the way the browser suite is dealt below, and
  # test/lib/test_shards_test.rb keeps every file in exactly one shard. The
  # check that speaks for both is `test`, further down: the main branch's
  # ruleset requires a check of that name.
  test-shard:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        # Install first, update only if that fails: the runner image ships apt lists
        # (the logs show `Hit:` on them), and `apt-get update` is the step whose time
        # varies from ten seconds to nearly five minutes on a slow mirror, while the
        # packages themselves are small. A stale list that 404s falls back to it.
        run: sudo apt-get install --no-install-recommends -y libpq-dev libvips || { sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips; }

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The files are named, and `bin/rails test FILES` does not run
      # `test:prepare`, which is what built the stylesheets when the whole
      # suite was run (every public test reads app/assets/builds/tailwind.css
      # and theme.css). So they are built first, by hand, as the browser shards
      # do: `tailwindcss:build` is enhanced to build the public theme's
      # stylesheet too (lib/tasks/theme_css.rake). `-v` prints
      # each test with its time: test/unit_test_seconds.yml is measured from
      # this log, since a runner's pace is not a laptop's.
      - name: Run tests
        env:
          RAILS_ENV: test
          # Tests print everything in CI (migration statements, seed output);
          # a local run is quiet unless VERBOSE=1 is set (test/test_helper.rb).
          VERBOSE: "1"
          # SimpleCov (test/test_helper.rb): the report is kept as an artifact.
          COVERAGE: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bin/rails db:test:prepare tailwindcss:build
          bin/rails test -v $(bin/test-shard unit ${{ matrix.shard }} 2)

      # The stylesheet built with THEME_PATH set, and production started
      # under that theme (bin/theme-build-check). After the tests, because
      # it writes app/assets/builds, which every public test reads. A step of
      # ONE shard, the first, and not a job of its own: a job pays its setup
      # time and would set up Ruby again, while here it is three boots of the
      # application, about ten seconds, and shard 0 is the lighter shard.
      # Never in both shards: a second run would only repeat the first.
      - name: Build the stylesheet under a theme and start production under it
        if: matrix.shard == 0
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/theme-build-check

      # One report per shard, each under a name of its own (two uploads under
      # one name fail). They are not merged: each shows the lines its own half
      # of the suite ran, and there is no minimum to check against yet, so a
      # merged number would be read by no one. Add a merge step (SimpleCov's
      # `collate`) the day a minimum is set.
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: ${{ github.workspace }}/coverage
          include-hidden-files: true
          if-no-files-found: ignore

  # One check that speaks for the two unit shards, under the name the main
  # branch's ruleset requires (`test`): green only when both shards passed.
  # A matrix job's checks are named `test-shard (0)` and so on, which that
  # ruleset does not list.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Did every shard pass?
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          [ "$SHARDS" = "success" ] || { echo "unit tests: $SHARDS"; exit 1; }

  # What changed, so the browser suite can be skipped when nothing it tests did.
  # Only documents count as "nothing": the unit suite reads them (the guards in
  # test/lib scan CLAUDE.md and docs/reference), so it always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything but documents change?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A run with no base (one started by hand) runs everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The image workflow is no code a browser test runs: a change of
          # that file alone skips the suite as a change of the docs does.
          if git diff --name-only "$BASE" "$HEAD" | grep -qvE '^(docs/|[^/]+\.md$|\.github/workflows/image\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The browser suite, as four jobs side by side: a runner has two cores, and
  # the whole suite on two processes took 28 minutes. `bin/test-shard system`
  # deals the files so each job takes about the same time, by the seconds in
  # test/system_test_seconds.yml (test/lib/test_shards_test.rb keeps every file
  # in exactly one).
  system-test-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        # Install first, update only if that fails: the runner image ships apt lists
        # (the logs show `Hit:` on them), and `apt-get update` is the step whose time
        # varies from ten seconds to nearly five minutes on a slow mirror, while the
        # packages themselves are small. A stale list that 404s falls back to it.
        run: sudo apt-get install --no-install-recommends -y libpq-dev libvips || { sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips; }

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Cuprite (via Ferrum) drives the Chrome that GitHub's ubuntu runners
      # ship preinstalled; BROWSER_PATH pins it rather than relying on
      # Ferrum's PATH search. The files are named, so this is `bin/rails test`
      # (`test:system` would ignore them), and the stylesheet is built first,
      # which `test:system` did by itself. `-v` prints each test with its time:
      # test/system_test_seconds.yml is measured from this log, since a runner's
      # pace is not a laptop's.
      - name: Run System Tests
        env:
          RAILS_ENV: test
          VERBOSE: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          BROWSER_PATH: /usr/bin/google-chrome
        run: |
          bin/rails db:test:prepare tailwindcss:build
          bin/rails test -v $(bin/test-shard system ${{ matrix.shard }} 4)

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # One check that speaks for the four: green when every shard passed, when
  # the suite was skipped because only documents changed.
  system-test:
    needs: [changes, system-test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Did every shard pass?
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.system-test-shard.result }}
        run: |
          if [ "$CODE" = "false" ] && [ "$SHARDS" = "skipped" ]; then
            echo "Only documents changed: the browser suite was not run."
            exit 0
          fi
          [ "$SHARDS" = "success" ] || { echo "system tests: $SHARDS"; exit 1; }
